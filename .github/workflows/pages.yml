name: Deploy personal project portal

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "scripts/**"
      - "README.md"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and deploy portal
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate portal and published project catalog
        run: node scripts/validate-portal.mjs

      - name: Browser smoke test (desktop and mobile)
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          CHROME_BIN="$(command -v google-chrome || command -v chromium)" node scripts/smoke-portal.mjs

      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-smoke-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
