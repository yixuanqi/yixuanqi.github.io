      uniform vec2 uTexelSize;
      varying vec2 vUv;

      void main() {
        vec2 stepUv = uDirection * uTexelSize;
        vec3 sum = texture2D(tDiffuse, vUv).rgb * 0.22702703;
        sum += texture2D(tDiffuse, clamp(vUv + stepUv * 1.38461538, 0.001, 0.999)).rgb * 0.31621622;
        sum += texture2D(tDiffuse, clamp(vUv - stepUv * 1.38461538, 0.001, 0.999)).rgb * 0.31621622;
        sum += texture2D(tDiffuse, clamp(vUv + stepUv * 3.23076923, 0.001, 0.999)).rgb * 0.07027027;
        sum += texture2D(tDiffuse, clamp(vUv - stepUv * 3.23076923, 0.001, 0.999)).rgb * 0.07027027;
        gl_FragColor = vec4(sum, 1.0);
      }
    `;

    // ----------------------------------------------------------------------------
    // 2I. Post-Processing Pass 6: HDR Bloom + Tonemapping Composite -> tonemapRT
    //     Preserves sceneRT.a (rocket coverage mask) in gl_FragColor.a for Pass 7 FXAA!
    // ----------------------------------------------------------------------------
    const COMPOSITE_FRAG = /* glsl */ `
      precision highp float;

      uniform sampler2D tScene;
      uniform sampler2D tBloomTight;
      uniform sampler2D tBloomWide;

      uniform vec2  uCenter;
      uniform float uAspect;
      uniform float uWarp;
      uniform float uFovNorm;
      uniform float uBloomStrength;
      uniform float uChromatic;
      uniform float uTime;

      varying vec2 vUv;

      vec3 softKneeCompress(vec3 col, float knee, float ceiling) {
        float peak = max(col.r, max(col.g, col.b));
        if (peak <= knee) return col;
        float excess = peak - knee;
        float range = max(ceiling - knee, 0.001);
        float compressed = knee + range * (1.0 - exp(-excess / range));
        return col * (compressed / max(peak, 0.0001));
      }

      vec3 acesPerChannel(vec3 x) {
        const float a = 2.51;
        const float b = 0.03;
        const float c = 2.43;
        const float d = 0.59;
        const float e = 0.14;
        return clamp((x * (a * x + b)) / max(x * (c * x + d) + e, vec3(0.0001)), 0.0, 1.0);
      }

      vec3 acesHuePreserve(vec3 col) {
        float luma = dot(col, vec3(0.2126, 0.7152, 0.0722));
        float mappedLuma = (luma * (2.51 * luma + 0.03)) / max(luma * (2.43 * luma + 0.59) + 0.14, 0.0001);
        vec3 hueCol  = clamp(col * (mappedLuma / max(luma, 0.0001)), 0.0, 1.0);
        vec3 filmCol = acesPerChannel(col);
        return clamp(mix(filmCol, hueCol, 0.68), 0.0, 1.0);
      }

      void main() {
        vec2 uvOffset = vUv - uCenter;
        vec2 aspectVec = uvOffset * vec2(uAspect, 1.0);
        float dist = length(aspectVec);

        vec2 radialAspect = dist > 0.0001 ? (aspectVec / dist) : vec2(0.0);
        vec2 radialUvDir  = vec2(radialAspect.x / max(uAspect, 0.001), radialAspect.y);

        // Gentle peripheral optical curvature synced strictly to wide warp FOV (0 at rest)
        float lensPull = uFovNorm * 0.030 * smoothstep(0.16, 0.96, dist);
        vec2 sampleUv = uCenter + uvOffset * (1.0 - lensPull * dist * dist);

        // Radial edge chromatic aberration: strictly 0 when idle -> razor-sharp stars!
        float edgeMask = smoothstep(0.28, 0.98, dist);
        vec2 warpChroma = radialUvDir * (edgeMask * edgeMask * 0.0085 * uChromatic * uWarp);

        vec3 sceneCol;
        float rocketMask;
        if (dot(warpChroma, warpChroma) > 1e-10 || lensPull > 1e-5) {
          vec4 gTap = texture2D(tScene, clamp(sampleUv, 0.001, 0.999));
          sceneCol.r = texture2D(tScene, clamp(sampleUv + warpChroma, 0.001, 0.999)).r;
          sceneCol.g = gTap.g;
          sceneCol.b = texture2D(tScene, clamp(sampleUv - warpChroma, 0.001, 0.999)).b;
          rocketMask = gTap.a;
        } else {
          vec4 tap = texture2D(tScene, vUv);
          sceneCol = tap.rgb;
          rocketMask = tap.a;
        }

        sceneCol = softKneeCompress(sceneCol, 0.98, 2.30);

        // Dual-scale Black Pro-Mist HDR Bloom (1/2 tight star glow + 1/4 dreamy halo)
        vec3 bloomTight = texture2D(tBloomTight, clamp(sampleUv, 0.001, 0.999)).rgb;
        vec3 bloomWide  = texture2D(tBloomWide, clamp(sampleUv, 0.001, 0.999)).rgb;
        float bloomScale = uBloomStrength * mix(0.65, 1.0, uWarp);
        vec3 hdrCol = sceneCol + (bloomTight * 0.56 + bloomWide * 0.36) * bloomScale;

        // Subtle dark atmospheric vignette
        float vignette = 1.0 - smoothstep(0.52, 1.48, dist * 0.94);
        hdrCol *= mix(0.78, 1.0, vignette);

        // Hue-preserving ACES Filmic Tonemapping + Gamma Output
        vec3 mapped = acesHuePreserve(hdrCol * 1.02);
        mapped = pow(max(mapped, vec3(0.0)), vec3(1.0 / 2.2));

        // Output LDR RGB + pure rocket coverage alpha for selective Pass 7 FXAA
        gl_FragColor = vec4(clamp(mapped, 0.0, 1.0), clamp(rocketMask, 0.0, 1.0));
      }
    `;

    // ----------------------------------------------------------------------------
    // 2J. Post-Processing Pass 7: Selective Post-Tonemap FXAA 3.11 + 1/255 Dither
    //     Smooths 3D rocket silhouettes, gold collars & fins to buttery perfection
    //     even on dpr=1 screens while leaving 1px background stars 100% untouched!
    // ----------------------------------------------------------------------------
    const FXAA_FRAG = /* glsl */ `
      precision highp float;

      uniform sampler2D tDiffuse;
      uniform vec2  uTexelSize;
      uniform float uFxaaStrength;
      uniform float uTime;

      varying vec2 vUv;

      float getLuma(vec3 rgb) {
        return dot(rgb, vec3(0.299, 0.587, 0.114));
      }

      float hash12(vec2 p) {
        vec3 p3 = fract(vec3(p.xyx) * 0.1031);
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
      }

      void main() {
        vec4 tapM = texture2D(tDiffuse, vUv);
        vec3 colM = tapM.rgb;

        // Sample 3x3 neighborhood to dilate rocket coverage by 1px (covers both sides of silhouette edge)
        vec4 tapN  = texture2D(tDiffuse, vUv + vec2( 0.0,  uTexelSize.y));
        vec4 tapS  = texture2D(tDiffuse, vUv + vec2( 0.0, -uTexelSize.y));
        vec4 tapE  = texture2D(tDiffuse, vUv + vec2( uTexelSize.x, 0.0));
        vec4 tapW  = texture2D(tDiffuse, vUv + vec2(-uTexelSize.x, 0.0));
        vec4 tapNE = texture2D(tDiffuse, vUv + vec2( uTexelSize.x,  uTexelSize.y));
        vec4 tapNW = texture2D(tDiffuse, vUv + vec2(-uTexelSize.x,  uTexelSize.y));
        vec4 tapSE = texture2D(tDiffuse, vUv + vec2( uTexelSize.x, -uTexelSize.y));
        vec4 tapSW = texture2D(tDiffuse, vUv + vec2(-uTexelSize.x, -uTexelSize.y));

        float maxMask = max(
          tapM.a,
          max(max(max(tapN.a, tapS.a), max(tapE.a, tapW.a)),
              max(max(tapNE.a, tapNW.a), max(tapSE.a, tapSW.a)))
        );

        vec3 finalRgb = colM;

        // Only execute FXAA where the 3D rocket occupies or borders this pixel -> 1px stars stay 100% crisp!
        if (maxMask > 0.004 && uFxaaStrength > 0.001) {
          float lumaM  = getLuma(colM);
          float lumaN  = getLuma(tapN.rgb);
          float lumaS  = getLuma(tapS.rgb);
          float lumaE  = getLuma(tapE.rgb);
          float lumaW  = getLuma(tapW.rgb);
          float lumaNE = getLuma(tapNE.rgb);
          float lumaNW = getLuma(tapNW.rgb);
          float lumaSE = getLuma(tapSE.rgb);
          float lumaSW = getLuma(tapSW.rgb);

          float lumaMin = min(lumaM, min(min(lumaN, lumaS), min(lumaE, lumaW)));
          float lumaMax = max(lumaM, max(max(lumaN, lumaS), max(lumaE, lumaW)));
          float lumaRange = lumaMax - lumaMin;

          if (lumaRange >= max(0.025, lumaMax * 0.0625)) {
            // Subpixel contrast filter
            float lumaL = (lumaN + lumaS + lumaE + lumaW) * 0.25;
            float rangeL = abs(lumaL - lumaM);
            float subpix = clamp(rangeL / max(lumaRange, 0.0001), 0.0, 1.0);
            subpix = smoothstep(0.0, 1.0, subpix);
            float subpixBlend = subpix * subpix * 0.72;

            // Detect edge orientation (horizontal vs vertical)
            float edgeH = abs(-2.0 * lumaW + lumaNW + lumaSW)
                        + abs(-2.0 * lumaM + lumaN  + lumaS ) * 2.0
                        + abs(-2.0 * lumaE + lumaNE + lumaSE);
            float edgeV = abs(-2.0 * lumaN + lumaNW + lumaNE)
                        + abs(-2.0 * lumaM + lumaW  + lumaE ) * 2.0
                        + abs(-2.0 * lumaS + lumaSW + lumaSE);
            bool isHoriz = edgeH >= edgeV;

            float luma1 = isHoriz ? lumaS : lumaW;
            float luma2 = isHoriz ? lumaN : lumaE;
            float grad1 = abs(luma1 - lumaM);
            float grad2 = abs(luma2 - lumaM);
            bool is1Steepest = grad1 >= grad2;
            float gradScaled = 0.25 * max(grad1, grad2);

            float stepLen = isHoriz ? uTexelSize.y : uTexelSize.x;
            float lumaLocalAvg;
            if (is1Steepest) {
              stepLen = -stepLen;
              lumaLocalAvg = 0.5 * (luma1 + lumaM);
            } else {
              lumaLocalAvg = 0.5 * (luma2 + lumaM);
            }

            vec2 curUv = vUv;
            if (isHoriz) curUv.y += stepLen * 0.5;
            else         curUv.x += stepLen * 0.5;

            vec2 offset = isHoriz ? vec2(uTexelSize.x, 0.0) : vec2(0.0, uTexelSize.y);
            vec2 uv1 = curUv - offset;
            vec2 uv2 = curUv + offset;

            float lumaEnd1 = getLuma(texture2D(tDiffuse, uv1).rgb) - lumaLocalAvg;
            float lumaEnd2 = getLuma(texture2D(tDiffuse, uv2).rgb) - lumaLocalAvg;
            bool reached1 = abs(lumaEnd1) >= gradScaled;
            bool reached2 = abs(lumaEnd2) >= gradScaled;

            // 5-step edge tangent search for smooth diagonal silhouettes
            for (int i = 0; i < 5; i++) {
              if (!reached1) {
                uv1 -= offset * (i < 2 ? 1.0 : 1.5);
                lumaEnd1 = getLuma(texture2D(tDiffuse, uv1).rgb) - lumaLocalAvg;
                reached1 = abs(lumaEnd1) >= gradScaled;
              }
              if (!reached2) {
                uv2 += offset * (i < 2 ? 1.0 : 1.5);
                lumaEnd2 = getLuma(texture2D(tDiffuse, uv2).rgb) - lumaLocalAvg;
                reached2 = abs(lumaEnd2) >= gradScaled;
              }
              if (reached1 && reached2) break;
            }

            float dist1 = isHoriz ? (vUv.x - uv1.x) : (vUv.y - uv1.y);
            float dist2 = isHoriz ? (uv2.x - vUv.x) : (uv2.y - vUv.y);
            bool isDir1 = dist1 < dist2;
            float distFinal = min(dist1, dist2);
            float edgeThick = max(dist1 + dist2, 0.0001);
            float pixelOff = -distFinal / edgeThick + 0.5;

            bool isLumaMSmaller = lumaM < lumaLocalAvg;
            bool correctVar = ((isDir1 ? lumaEnd1 : lumaEnd2) < 0.0) != isLumaMSmaller;
            float finalOff = correctVar ? pixelOff : 0.0;
            finalOff = max(finalOff, subpixBlend);

            vec2 aaUv = vUv;
            if (isHoriz) aaUv.y += finalOff * stepLen;
            else         aaUv.x += finalOff * stepLen;

            vec3 aaRgb = texture2D(tDiffuse, clamp(aaUv, 0.001, 0.999)).rgb;
            float blendW = smoothstep(0.0, 0.22, maxMask) * uFxaaStrength;
            finalRgb = mix(colM, aaRgb, blendW);
          }
        }

        // Subtle 1/255 animated hash dither eliminates dark-sky banding
        float dither = (hash12(gl_FragCoord.xy + fract(uTime * 1.618) * 257.0) - 0.5) / 255.0 * 1.6;
        finalRgb = clamp(finalRgb + dither, 0.0, 1.0);

        gl_FragColor = vec4(finalRgb, 1.0);
      }
    `;

    // ============================================================================
    // 3. ULTRA-Q ROUND-HEAD 3D CHIBI ROCKET BUILDER (DESIGNER VINYL TOY FINISH)
    // ============================================================================
    function buildChibiRocket3D(disposables) {
      const root = new THREE.Group();

      // Tactile matte-satin designer-toy materials (soft plush highlights, never harsh)
      const bodyMat = new THREE.MeshPhysicalMaterial({
        color: 0xFBF5EA, // Warm milky-cream chubby belly
        roughness: 0.40,
        metalness: 0.03,
        clearcoat: 0.32,
        clearcoatRoughness: 0.28,
      });

      const coralMat = new THREE.MeshPhysicalMaterial({
        color: 0xF2645E, // Smooth flush coral-red glossy-satin
        roughness: 0.38,
        metalness: 0.03,
        clearcoat: 0.36,
        clearcoatRoughness: 0.26,
      });

      const goldMat = new THREE.MeshPhysicalMaterial({
        color: 0xECC368, // Plump warm honey-gold
        roughness: 0.30,
        metalness: 0.58,
        clearcoat: 0.35,
        clearcoatRoughness: 0.22,
      });

      // Helper for C1-continuous chubby capsule-pear belly Bezier (y: -0.68 -> +0.4267)
      // Joins smoothly into a PURE hemispherical dome cap (center y = 0.35, R = 0.55, apex y = +0.90)
      const R_HEAD = 0.55;
      const Y_HEAD_CENTER = 0.35;
      const PHI_JOIN = 0.14; // 8 deg above dome equator for effortless C1 pear transition
      const R_JOIN = R_HEAD * Math.cos(PHI_JOIN); // 0.5446
      const Y_JOIN = Y_HEAD_CENTER + R_HEAD * Math.sin(PHI_JOIN); // 0.4267

      const B0 = new THREE.Vector2(0.275, -0.68);
      const B1 = new THREE.Vector2(0.615, -0.57);
      const B2 = new THREE.Vector2(0.598,  0.0467); // Exact C1 tangent match (-tan(0.14)) into dome!
      const B3 = new THREE.Vector2(R_JOIN, Y_JOIN);

      function evalBellyBezier(t) {
        const mt = 1 - t;
        const mt2 = mt * mt;
        const t2 = t * t;
        const a = mt2 * mt;
        const b = 3 * mt2 * t;
        const c = 3 * mt * t2;
        const d = t2 * t;
        return new THREE.Vector2(
          a * B0.x + b * B1.x + c * B2.x + d * B3.x,
          a * B0.y + b * B1.y + c * B2.y + d * B3.y
        );
      }

      // 1) Milky-Cream Chubby Capsule-Pear Belly (96 radial segments, 42 smooth curve points)
      const bellyPts = [new THREE.Vector2(0.0, -0.68)];
      const bellySteps = 42;
      for (let i = 0; i <= bellySteps; i++) {
        bellyPts.push(evalBellyBezier(i / bellySteps));
      }
      const bellyGeo = new THREE.LatheGeometry(bellyPts, 96);
      const bellyMesh = new THREE.Mesh(bellyGeo, bodyMat);
      root.add(bellyMesh);
      disposables.push(bellyGeo, bodyMat);

      // 2) Pure Hemispherical Rounded Coral-Red Dome Head (NO pointy cone, NO finial, NO antenna!)
      //    96 radial segments x 30 spherical-cap profile points (>64 total smooth profile points)
      const domePts = [];
      const domeSteps = 30;
      for (let i = 0; i <= domeSteps; i++) {
        const phi = PHI_JOIN + (i / domeSteps) * (Math.PI * 0.5 - PHI_JOIN);
        const r = i === domeSteps ? 0.0 : R_HEAD * Math.cos(phi) + 0.0025;
        const y = Y_HEAD_CENTER + R_HEAD * Math.sin(phi);
        domePts.push(new THREE.Vector2(r, y));
      }
      const domeGeo = new THREE.LatheGeometry(domePts, 96);
      const domeMesh = new THREE.Mesh(domeGeo, coralMat);
      root.add(domeMesh);
      disposables.push(domeGeo, coralMat);

      // 3) Plump Smooth Honey-Gold Collar Ring at Dome/Belly Seam
      const collarGeo = new THREE.TorusGeometry(R_JOIN + 0.009, 0.028, 24, 96);
      collarGeo.rotateX(Math.PI * 0.5);
      const collarMesh = new THREE.Mesh(collarGeo, goldMat);
      collarMesh.position.y = Y_JOIN;
      root.add(collarMesh);

      // Short Chunky Honey-Gold Tail Collar
      const tailCollarGeo = new THREE.TorusGeometry(0.292, 0.030, 20, 72);
      tailCollarGeo.rotateX(Math.PI * 0.5);
      const tailCollarMesh = new THREE.Mesh(tailCollarGeo, goldMat);
      tailCollarMesh.position.y = -0.665;
      root.add(tailCollarMesh);
      disposables.push(goldMat, collarGeo, tailCollarGeo);

      // 4) Oversized Adorable Round Porthole Window (Centered Slightly Upper-Front on Chubby Belly)
      const portholeGroup = new THREE.Group();
      portholeGroup.position.set(0, 0.05, 0.562);
      portholeGroup.rotation.x = -0.05;

      // Thick smooth honey-gold bezel (32x64 segments)
      const bezelGeo = new THREE.TorusGeometry(0.242, 0.048, 32, 64);
      const bezelMesh = new THREE.Mesh(bezelGeo, goldMat);
      portholeGroup.add(bezelMesh);

      // 8 tiny spherical gold rivets nestled symmetrically around the rim
      const rivetGeo = new THREE.SphereGeometry(0.017, 16, 12);
      for (let i = 0; i < 8; i++) {
        const a = (i * Math.PI * 2) / 8 + Math.PI / 8;
        const rivet = new THREE.Mesh(rivetGeo, goldMat);
        rivet.position.set(Math.cos(a) * 0.242, Math.sin(a) * 0.242, 0.044);
        portholeGroup.add(rivet);
      }

      // Recessed deep-navy cozy cabin interior
      const cabinGeo = new THREE.SphereGeometry(0.228, 32, 20, 0, Math.PI * 2, 0, Math.PI * 0.55);
      cabinGeo.rotateX(-Math.PI * 0.5);
      cabinGeo.scale(1, 1, 0.52);
      const cabinMat = new THREE.MeshStandardMaterial({
        color: 0x0B1A44,
        emissive: 0x0A1B4D,
        emissiveIntensity: 0.60,
        roughness: 0.52,
        metalness: 0.08,
        side: THREE.BackSide,
      });
      const cabinMesh = new THREE.Mesh(cabinGeo, cabinMat);
      cabinMesh.position.z = 0.004;
      portholeGroup.add(cabinMesh);

      // Chubby, smooth-beveled 3D glowing pastel-gold 4-point star gently floating inside
      const starShape = new THREE.Shape();
      const sOut = 0.100;
      const sIn = 0.042; // Chubbier inner waist for adorable plush star shape
      for (let i = 0; i < 8; i++) {
        const ang = (i * Math.PI) / 4;
        const rad = i % 2 === 0 ? sOut : sIn;
        const sx = Math.cos(ang) * rad;
        const sy = Math.sin(ang) * rad;
        if (i === 0) starShape.moveTo(sx, sy);
        else starShape.lineTo(sx, sy);
      }
      starShape.closePath();

      const cabinStarGeo = new THREE.ExtrudeGeometry(starShape, {
        depth: 0.026,
        bevelEnabled: true,
        bevelThickness: 0.016,
        bevelSize: 0.014,
        bevelSegments: 6,
      });
      cabinStarGeo.center();
      const cabinStarMat = new THREE.MeshStandardMaterial({
        color: 0xFFF5CC,
        emissive: 0xFFDC78,
        emissiveIntensity: 1.40,
        roughness: 0.24,
        metalness: 0.15,
      });
      const cabinStarMesh = new THREE.Mesh(cabinStarGeo, cabinStarMat);
      cabinStarMesh.position.set(0.0, 0.0, 0.022);
      portholeGroup.add(cabinStarMesh);

      // Gently domed crystal-clear sky-blue glass lens with soft specular reflection
      const glassGeo = new THREE.SphereGeometry(0.228, 36, 22, 0, Math.PI * 2, 0, Math.PI * 0.46);
      glassGeo.rotateX(Math.PI * 0.5);
      glassGeo.scale(1, 1, 0.42);
      const glassMat = new THREE.MeshPhysicalMaterial({
        color: 0x9CD9FF,
        emissive: 0x1E5494,
        emissiveIntensity: 0.20,
        roughness: 0.06,
        metalness: 0.02,
        transparent: true,
        opacity: 0.34,
        clearcoat: 1.0,
        clearcoatRoughness: 0.05,
        reflectivity: 0.92,
        depthWrite: false,
      });
      const glassMesh = new THREE.Mesh(glassGeo, glassMat);
      glassMesh.position.z = 0.014;
      portholeGroup.add(glassMesh);

      // Soft curved specular glint & tiny secondary dot on glass dome
      const glintGeo = new THREE.SphereGeometry(0.036, 16, 12);
      glintGeo.scale(1.45, 0.68, 0.32);
      const glintMat = new THREE.MeshBasicMaterial({
        color: 0xFFFFFF,
        transparent: true,
        opacity: 0.80,
        depthWrite: false,
      });
      const glintMesh = new THREE.Mesh(glintGeo, glintMat);
      glintMesh.position.set(-0.095, 0.088, 0.088);
      glintMesh.rotation.z = 0.62;
      portholeGroup.add(glintMesh);

      const glintDotGeo = new THREE.SphereGeometry(0.015, 12, 10);
      const glintDot = new THREE.Mesh(glintDotGeo, glintMat);
      glintDot.position.set(-0.135, 0.036, 0.072);
      portholeGroup.add(glintDot);

      root.add(portholeGroup);
      disposables.push(bezelGeo, rivetGeo, cabinGeo, cabinMat, cabinStarGeo, cabinStarMat, glassGeo, glassMat, glintGeo, glintMat, glintDotGeo);

      // 5) Cute Rosy Blush Cheeks: Two Subtle Pastel Peach-Pink Smooth Oval Patches
      //    Symmetrically hugging the curved cream belly just below-left & below-right of porthole
      const blushGeo = new THREE.SphereGeometry(0.068, 24, 16);
      blushGeo.scale(1.28, 0.72, 0.16);
      const blushMat = new THREE.MeshPhysicalMaterial({
        color: 0xFF9EA6,
        emissive: 0xFF7B89,
        emissiveIntensity: 0.14,
        roughness: 0.58,
        metalness: 0.0,
        clearcoat: 0.18,
        clearcoatRoughness: 0.40,
        transparent: true,
        opacity: 0.76,
      });
      // Sample belly surface at t = 0.54 (just below porthole) for exact curvature hug
      const cheekPt = evalBellyBezier(0.54);
      const cheekNext = evalBellyBezier(0.56);
      const cheekSlope = Math.atan2(cheekPt.x - cheekNext.x, cheekNext.y - cheekPt.y);
      [-1, 1].forEach((side) => {
        const az = side * 0.54; // ~31 deg left & right of front +Z
        const rSurf = cheekPt.x + 0.002;
        const cheek = new THREE.Mesh(blushGeo, blushMat);
        cheek.position.set(Math.sin(az) * rSurf, cheekPt.y, Math.cos(az) * rSurf);
        cheek.rotation.order = 'YXZ';
        cheek.rotation.y = az;
        cheek.rotation.x = cheekSlope;
        cheek.rotation.z = -side * 0.12;
        root.add(cheek);
      });
      disposables.push(blushGeo, blushMat);

      // 6) Three Plump, Chubby, Stubby Dolphin-Flipper Fins at 120° Around Lower Belly
      //    Generous thick smooth bevels (curveSegments: 36, bevelSegments: 14) for pillowy huggable feel
      const finShape = new THREE.Shape();
      finShape.moveTo(0.32, -0.14);
      finShape.bezierCurveTo(0.65, -0.17, 0.88, -0.39, 0.84, -0.66);
      finShape.bezierCurveTo(0.81, -0.82, 0.64, -0.86, 0.52, -0.78);
      finShape.bezierCurveTo(0.41, -0.70, 0.33, -0.60, 0.22, -0.56);
      finShape.lineTo(0.22, -0.16);
      finShape.closePath();

      const finGeo = new THREE.ExtrudeGeometry(finShape, {
        depth: 0.044,
        bevelEnabled: true,
        bevelThickness: 0.082,
        bevelSize: 0.070,
        bevelSegments: 14,
        curveSegments: 36,
      });
      finGeo.translate(0, 0, -0.022);

      const finAngles = [
        Math.PI * 0.5,                     // Back (-Z)
        Math.PI * 0.5 - (Math.PI * 2) / 3, // Front-Right
        Math.PI * 0.5 + (Math.PI * 2) / 3, // Front-Left
      ];
      finAngles.forEach((ang) => {
        const finMesh = new THREE.Mesh(finGeo, coralMat);
        finMesh.rotation.y = ang;
        root.add(finMesh);
      });
      disposables.push(finGeo);

      // 7) Compact Rounded Metallic Nozzle (Warm Charcoal-Slate) + Soft Amber-Peach Inner Core
      const nozzlePts = [
        new THREE.Vector2(0.19, -0.66),
        new THREE.Vector2(0.22, -0.69),
        new THREE.Vector2(0.275, -0.80),
        new THREE.Vector2(0.285, -0.855),
        new THREE.Vector2(0.268, -0.885),
        new THREE.Vector2(0.235, -0.885),
        new THREE.Vector2(0.185, -0.74),
      ];
      const nozzleGeo = new THREE.LatheGeometry(nozzlePts, 64);
      const nozzleMat = new THREE.MeshPhysicalMaterial({
        color: 0x454E63,
        metalness: 0.62,
        roughness: 0.34,
        clearcoat: 0.25,
        clearcoatRoughness: 0.30,
      });
      const nozzleMesh = new THREE.Mesh(nozzleGeo, nozzleMat);
      root.add(nozzleMesh);

      const emberGeo = new THREE.CircleGeometry(0.215, 36);
      emberGeo.rotateX(Math.PI * 0.5);
      const emberMat = new THREE.MeshBasicMaterial({
        color: 0xFFC27A,
        side: THREE.DoubleSide,
      });
      const emberMesh = new THREE.Mesh(emberGeo, emberMat);
      emberMesh.position.y = -0.785;
      root.add(emberMesh);
      disposables.push(nozzleGeo, nozzleMat, emberGeo, emberMat);

      // 8) Smooth Chubby Teardrop Dual-Layer 3D Animated GLSL Flame
      //    Uses alpha-preserving CustomBlending so sceneRT.a stays a pure rocket silhouette mask!
      function createChubbyFlameLathe(maxR, length) {
        const pts = [];
        const segs = 24;
        for (let i = 0; i <= segs; i++) {
          const t = i / segs;
          const y = -t * length;
          // Plump rounded teardrop curve
          const r = maxR * Math.sin(Math.pow(t, 0.56) * Math.PI);
          pts.push(new THREE.Vector2(Math.max(0.0, r), y));
        }
        return new THREE.LatheGeometry(pts, 48);
      }

      const outerFlameGeo = createChubbyFlameLathe(0.255, 0.80);
      const outerFlameUniforms = {
        uTime: { value: 0 },
        uFlamePower: { value: 0.25 },
        uFlameStretch: { value: 0.82 },
        uPhaseOffset: { value: 0.0 },
        uColorTop: { value: new THREE.Color('#FFAA64') },
        uColorTip: { value: new THREE.Color('#F25B4E') },
        uOpacityScale: { value: 0.92 },
      };
      const outerFlameMat = new THREE.ShaderMaterial({
        vertexShader: FLAME_VERT,
        fragmentShader: FLAME_FRAG,
        uniforms: outerFlameUniforms,
        transparent: true,
        blending: THREE.CustomBlending,
        blendEquation: THREE.AddEquation,
        blendSrc: THREE.SrcAlphaFactor,
        blendDst: THREE.OneFactor,
        blendEquationAlpha: THREE.AddEquation,
        blendSrcAlpha: THREE.ZeroFactor,
        blendDstAlpha: THREE.OneFactor,
        depthWrite: false,
        side: THREE.DoubleSide,
      });
      const outerFlameMesh = new THREE.Mesh(outerFlameGeo, outerFlameMat);
      outerFlameMesh.position.y = -0.80;
      root.add(outerFlameMesh);

      const innerFlameGeo = createChubbyFlameLathe(0.155, 0.55);
      const innerFlameUniforms = {
        uTime: { value: 0 },
        uFlamePower: { value: 0.25 },
        uFlameStretch: { value: 0.78 },
        uPhaseOffset: { value: 2.4 },
        uColorTop: { value: new THREE.Color('#FFFCE0') },
        uColorTip: { value: new THREE.Color('#FFD466') },
        uOpacityScale: { value: 1.25 },
      };
      const innerFlameMat = new THREE.ShaderMaterial({
        vertexShader: FLAME_VERT,
        fragmentShader: FLAME_FRAG,
        uniforms: innerFlameUniforms,
        transparent: true,
        blending: THREE.CustomBlending,
        blendEquation: THREE.AddEquation,
        blendSrc: THREE.SrcAlphaFactor,
        blendDst: THREE.OneFactor,
        blendEquationAlpha: THREE.AddEquation,
        blendSrcAlpha: THREE.ZeroFactor,
        blendDstAlpha: THREE.OneFactor,
        depthWrite: false,
        side: THREE.DoubleSide,
      });
      const innerFlameMesh = new THREE.Mesh(innerFlameGeo, innerFlameMat);
      innerFlameMesh.position.y = -0.79;
      root.add(innerFlameMesh);
      disposables.push(outerFlameGeo, outerFlameMat, innerFlameGeo, innerFlameMat);

      // 9) Flickering Warm PointLight Under Nozzle (Illuminates Chubby Belly & Fins Underside)
      const nozzleLight = new THREE.PointLight(0xFF9F5A, 1.2, 5.5, 2.0);
      nozzleLight.position.set(0, -1.04, 0.16);
      root.add(nozzleLight);

      // 10) Invisible Generous Hit-Sphere for Effortless THREE.Raycaster Click & Hover
      const hitGeo = new THREE.SphereGeometry(1.18, 16, 12);
      const hitMat = new THREE.MeshBasicMaterial({
        transparent: true,
        opacity: 0.0,
        colorWrite: false,
        depthWrite: false,
      });
      const hitMesh = new THREE.Mesh(hitGeo, hitMat);
      hitMesh.position.y = 0.06;
      root.add(hitMesh);
      disposables.push(hitGeo, hitMat);

      return {
        root,
        hitMesh,
        cabinStarMesh,
        nozzleLight,
        emberMat,
        outerFlameUniforms,
        innerFlameUniforms,
      };
    }

    // ============================================================================
    // 4. 3D STARLIGHT EXHAUST PUFFS & SPARKLES POOL (IN rocketScene)
    // ============================================================================
    class ExhaustParticlePool3D {
      constructor(maxCount, scene, disposables) {
        this.maxCount = maxCount;
        this.cursor = 0;

        this.positions = new Float32Array(maxCount * 3);
        this.sizes = new Float32Array(maxCount);
        this.alphas = new Float32Array(maxCount);
        this.types = new Float32Array(maxCount);
        this.rots = new Float32Array(maxCount);
        this.colors = new Float32Array(maxCount * 3);

        this.particles = [];
        for (let i = 0; i < maxCount; i++) {
          this.particles.push({
            alive: false,
            px: 0, py: 0, pz: 0,
            vx: 0, vy: 0, vz: 0,
            age: 0, life: 1,
            startSize: 0.2, endSize: 0.5,
            type: 0,
            rot: 0, vRot: 0,
            r: 1, g: 1, b: 1,
          });
        }

        const geo = new THREE.BufferGeometry();
        this.posAttr = new THREE.BufferAttribute(this.positions, 3);
        this.sizeAttr = new THREE.BufferAttribute(this.sizes, 1);
        this.alphaAttr = new THREE.BufferAttribute(this.alphas, 1);
        this.typeAttr = new THREE.BufferAttribute(this.types, 1);
        this.rotAttr = new THREE.BufferAttribute(this.rots, 1);
        this.colorAttr = new THREE.BufferAttribute(this.colors, 3);

        geo.setAttribute('position', this.posAttr);
        geo.setAttribute('aSize', this.sizeAttr);
        geo.setAttribute('aAlpha', this.alphaAttr);
        geo.setAttribute('aType', this.typeAttr);
        geo.setAttribute('aRot', this.rotAttr);
        geo.setAttribute('aColor', this.colorAttr);

        this.uniforms = {
          uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) },
          uProjScale: { value: 600 },
        };

        const mat = new THREE.ShaderMaterial({
          vertexShader: EXHAUST_PARTICLE_VERT,
          fragmentShader: EXHAUST_PARTICLE_FRAG,
          uniforms: this.uniforms,
          transparent: true,
          blending: THREE.CustomBlending,
          blendEquation: THREE.AddEquation,
          blendSrc: THREE.SrcAlphaFactor,
          blendDst: THREE.OneFactor,
          blendEquationAlpha: THREE.AddEquation,
          blendSrcAlpha: THREE.ZeroFactor,
          blendDstAlpha: THREE.OneFactor,
          depthWrite: false,
          depthTest: true,
        });

        this.points = new THREE.Points(geo, mat);
        this.points.frustumCulled = false;
        this.points.renderOrder = 30;
        scene.add(this.points);
        disposables.push(geo, mat);
      }

      spawn(opts) {
        const p = this.particles[this.cursor];
        this.cursor = (this.cursor + 1) % this.maxCount;
        p.alive = true;
        p.px = opts.x; p.py = opts.y; p.pz = opts.z;
        p.vx = opts.vx; p.vy = opts.vy; p.vz = opts.vz;
        p.age = 0;
        p.life = opts.life;
        p.startSize = opts.startSize;
        p.endSize = opts.endSize;
        p.type = opts.type;
        p.rot = Math.random() * Math.PI * 2;
        p.vRot = (Math.random() - 0.5) * 4.5;
        p.r = opts.color.r;
        p.g = opts.color.g;
        p.b = opts.color.b;
      }

      update(dt, viewportHeight, fovDeg, dpr) {
        const projScale = viewportHeight / (2.0 * Math.tan(THREE.MathUtils.degToRad(fovDeg * 0.5)));
        this.uniforms.uProjScale.value = projScale;
        this.uniforms.uPixelRatio.value = dpr;

        let anyAlive = false;
        const damp = Math.exp(-dt * 2.2);

        for (let i = 0; i < this.maxCount; i++) {
          const p = this.particles[i];
          if (!p.alive) {
            this.alphas[i] = 0;
            continue;
          }

          p.age += dt;
          if (p.age >= p.life) {
            p.alive = false;
            this.alphas[i] = 0;
            continue;
          }

          anyAlive = true;
          const t = p.age / p.life;
          p.px += p.vx * dt;
          p.py += p.vy * dt;
          p.pz += p.vz * dt;
          p.vx *= damp;
          p.vy *= damp;
          p.vz *= damp;
          p.rot += p.vRot * dt;

          const size = p.startSize + (p.endSize - p.startSize) * (1.0 - Math.pow(1.0 - t, 2.0));
          let alpha;
          if (p.type < 0.5) {
            // Soft cloud puff fade
            alpha = Math.sin(Math.min(1.0, t * 5.0) * Math.PI * 0.5) * Math.pow(1.0 - t, 1.8) * 0.62;
          } else {
            // Twinkling sparkle pop & fade
            const pop = t < 0.16 ? (t / 0.16) : (1.0 - (t - 0.16) / 0.84);
            const tw = 0.72 + 0.28 * Math.sin(p.age * 24.0 + i);
            alpha = Math.max(0.0, pop) * tw * 0.95;
          }

          this.positions[i * 3 + 0] = p.px;
          this.positions[i * 3 + 1] = p.py;
          this.positions[i * 3 + 2] = p.pz;
          this.sizes[i] = size;
          this.alphas[i] = alpha;
          this.types[i] = p.type;
          this.rots[i] = p.rot;
          this.colors[i * 3 + 0] = p.r;
          this.colors[i * 3 + 1] = p.g;
          this.colors[i * 3 + 2] = p.b;
        }

        this.points.visible = anyAlive;
        if (anyAlive) {
          this.posAttr.needsUpdate = true;
          this.sizeAttr.needsUpdate = true;
          this.alphaAttr.needsUpdate = true;
          this.typeAttr.needsUpdate = true;
          this.rotAttr.needsUpdate = true;
          this.colorAttr.needsUpdate = true;
        }
      }
    }

    // ============================================================================
    // 5. GEOMETRY & SPECTRAL DISTRIBUTION HELPERS
    // ============================================================================
    function writeSpectralWeights(arr, idx, bias = [0.36, 0.34, 0.19, 0.11]) {
      const r = Math.random();
      let primary = 0;
      if (r < bias[0]) primary = 0;
      else if (r < bias[0] + bias[1]) primary = 1;
      else if (r < bias[0] + bias[1] + bias[2]) primary = 2;
      else primary = 3;

      const secondary = (primary + (Math.random() < 0.5 ? 1 : 3)) % 4;
      const blend = 0.76 + Math.random() * 0.24;

      const w = [0, 0, 0, 0];
      w[primary] = blend;
      w[secondary] = 1.0 - blend;

      arr[idx * 4 + 0] = w[0];
      arr[idx * 4 + 1] = w[1];
      arr[idx * 4 + 2] = w[2];
      arr[idx * 4 + 3] = w[3];
    }

    function createCleanInstancedQuadGeometry(instanceCount) {
      const geo = new THREE.InstancedBufferGeometry();
      const positions = new Float32Array([
        -0.5, -0.5, 0.0,
         0.5, -0.5, 0.0,
         0.5,  0.5, 0.0,
        -0.5,  0.5, 0.0,
      ]);
      const indices = new Uint16Array([0, 1, 2, 0, 2, 3]);
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setIndex(new THREE.BufferAttribute(indices, 1));
      geo.instanceCount = instanceCount;
      return geo;
    }

    function evalCubicBezier3D(p0, p1, p2, p3, t, out) {
      const mt = 1 - t;
      const mt2 = mt * mt;
      const t2 = t * t;
      const a = mt2 * mt;
      const b = 3 * mt2 * t;
      const c = 3 * mt * t2;
      const d = t2 * t;
      out.set(
        a * p0.x + b * p1.x + c * p2.x + d * p3.x,
        a * p0.y + b * p1.y + c * p2.y + d * p3.y,
        a * p0.z + b * p1.z + c * p2.z + d * p3.z
      );
      return out;
    }

    // ============================================================================
    // 6. APPLICATION INITIALIZATION & 6-PASS HDR PIPELINE
    // ============================================================================
    function showError(msg) {
      const overlay = document.getElementById('error-overlay');
      const msgEl = document.getElementById('error-message');
      if (msgEl && msg) msgEl.textContent = msg;
      if (overlay) overlay.classList.remove('hidden');
    }

    function initApp() {
      const canvas = document.getElementById('cosmos-canvas');
      let renderer;

      try {
        renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: false,
          powerPreference: 'high-performance',
          stencil: false,
          depth: true,
        });
      } catch (err) {
        showError('WebGL 上下文创建失败：' + (err?.message || '未知错误'));
        return;
      }

      const getDPR = () => Math.min(window.devicePixelRatio || 1, 2);
      renderer.setPixelRatio(getDPR());
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      renderer.autoClear = false;
      renderer.outputColorSpace = THREE.LinearSRGBColorSpace;

      const isWebGL2 = renderer.capabilities.isWebGL2;
      const supportsHalfFloat = isWebGL2
        ? Boolean(renderer.extensions.get('EXT_color_buffer_float') || renderer.extensions.get('EXT_color_buffer_half_float'))
        : Boolean(renderer.extensions.get('EXT_color_buffer_half_float'));
      const rtType = supportsHalfFloat ? THREE.HalfFloatType : THREE.UnsignedByteType;

      // Detect true hardware 4x MSAA support for HalfFloat HDR render targets in WebGL2
      let msaaSamples = 0;
      if (isWebGL2 && supportsHalfFloat) {
        try {
          const gl = renderer.getContext();
          const maxCap = Math.min(4, renderer.capabilities.maxSamples || 0);
          if (maxCap >= 2) {
            if (typeof gl.getInternalformatParameter === 'function') {
              const supported = gl.getInternalformatParameter(gl.RENDERBUFFER, gl.RGBA16F, gl.SAMPLES);
              if (supported && supported.length > 0) {
                msaaSamples = Math.min(maxCap, supported[0]);
              }
            } else {
              msaaSamples = maxCap;
            }
          }
        } catch (_err) {
          msaaSamples = 0;
        }
      }

      function createRT(w, h, withDepth = false, samples = 0, typeOverride = rtType) {
        return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
          type: typeOverride,
          format: THREE.RGBAFormat,
          minFilter: THREE.LinearFilter,
          magFilter: THREE.LinearFilter,
          wrapS: THREE.ClampToEdgeWrapping,
          wrapT: THREE.ClampToEdgeWrapping,
          depthBuffer: withDepth,
          stencilBuffer: false,
          samples,
        });
      }

      const initW = Math.max(1, Math.floor(window.innerWidth * getDPR()));
      const initH = Math.max(1, Math.floor(window.innerHeight * getDPR()));

      const spaceRT = createRT(initW, initH, false, 0);
      // Main HDR scene target with hardware 4x MSAA + depth buffer for buttery-smooth 3D rocket edges!
      const sceneRT = createRT(initW, initH, true, msaaSamples);
      const tonemapRT = createRT(initW, initH, false, 0, THREE.UnsignedByteType);
      const brightRT = createRT(Math.floor(initW * 0.5), Math.floor(initH * 0.5), false, 0);
      const bloomHalfA = createRT(Math.floor(initW * 0.5), Math.floor(initH * 0.5), false, 0);
      const bloomHalfB = createRT(Math.floor(initW * 0.5), Math.floor(initH * 0.5), false, 0);
      const bloomQuarterA = createRT(Math.floor(initW * 0.25), Math.floor(initH * 0.25), false, 0);
      const bloomQuarterB = createRT(Math.floor(initW * 0.25), Math.floor(initH * 0.25), false, 0);

      const disposables = [spaceRT, sceneRT, tonemapRT, brightRT, bloomHalfA, bloomHalfB, bloomQuarterA, bloomQuarterB];

      // --------------------------------------------------------------------------
      // Shared Perspective Camera (Used by both spaceScene & rocketScene!)
      // --------------------------------------------------------------------------
      const BASE_FOV = 54;
      const CHARGE_FOV = 45;
      const BH_ANCHOR = new THREE.Vector3(0, 0.25, -14.5);

      const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth / Math.max(window.innerHeight, 1), 0.1, 1000);
      camera.position.set(0, 0, 0);

      const resolutionVec = new THREE.Vector2(initW, initH);
      const vanishingUvVec = new THREE.Vector2(0.5, 0.5);
      const blackHoleUvVec = new THREE.Vector2(0.5, 0.5);

      // --------------------------------------------------------------------------
      // SCENE 1: spaceScene (Nebula Dome + Veil + 3 Continuous Dynamic SDF Star Layers)
      // --------------------------------------------------------------------------
      const spaceScene = new THREE.Scene();

      const backdropUniforms = {
        uTime: { value: 0 },
        uDrift: { value: 0 },
        uFlow: { value: 0 },
        uWarp: { value: 0 },
        uVeilOpacity: { value: 0 },
        uAspect: { value: window.innerWidth / Math.max(window.innerHeight, 1) },
        uTanHalfFov: { value: Math.tan(THREE.MathUtils.degToRad(BASE_FOV * 0.5)) },
        uVanishingOffset: { value: new THREE.Vector2(0, 0) },
        uCamRight: { value: new THREE.Vector3(1, 0, 0) },
        uCamUp: { value: new THREE.Vector3(0, 1, 0) },
        uCamForward: { value: new THREE.Vector3(0, 0, -1) },
        uSkyDeep: { value: liveColors.skyDeep },
        uSkyMid: { value: liveColors.skyMid },
        uNebulaA: { value: liveColors.nebulaA },
        uNebulaB: { value: liveColors.nebulaB },
        uVeilA: { value: liveColors.veilA },
        uVeilB: { value: liveColors.veilB },
        uVpGlow: { value: liveColors.vpGlow },
      };

      const backdropGeo = new THREE.PlaneGeometry(2, 2);
      const backdropMat = new THREE.ShaderMaterial({
        vertexShader: FULLSCREEN_VERT,
        fragmentShader: COSMOS_BACKDROP_FRAG,
        uniforms: backdropUniforms,
        side: THREE.DoubleSide,
        depthTest: false,
        depthWrite: false,
      });
      const backdropMesh = new THREE.Mesh(backdropGeo, backdropMat);
      backdropMesh.frustumCulled = false;
      backdropMesh.renderOrder = -100;
      spaceScene.add(backdropMesh);
      disposables.push(backdropGeo, backdropMat);

      function createCapsuleStarLayer({ count, zMin, zMax, layerMode, swirlRate, renderOrder, populate }) {
        const geo = createCleanInstancedQuadGeometry(count);
        const cylPos = new Float32Array(count * 3);
        const meta = new Float32Array(count * 4);
        const flags = new Float32Array(count * 4);
        const weights = new Float32Array(count * 4);

        populate(cylPos, meta, flags, weights, count, zMax - zMin);

        geo.setAttribute('aCylPos', new THREE.InstancedBufferAttribute(cylPos, 3));
        geo.setAttribute('aMeta', new THREE.InstancedBufferAttribute(meta, 4));
        geo.setAttribute('aFlags', new THREE.InstancedBufferAttribute(flags, 4));
        geo.setAttribute('aColorWeights', new THREE.InstancedBufferAttribute(weights, 4));

        const uniforms = {
          uTime: { value: 0 },
          uTravelDist: { value: 0 },
          uZMin: { value: zMin },
          uZMax: { value: zMax },
          uStretchWorld: { value: 0 },
          uWarpMix: { value: 0 },
          uCharge: { value: 0 },
          uDensityCutoff: { value: 1.0 },
          uLayerMode: { value: layerMode },
          uSwirlRate: { value: swirlRate },
          uPixelRatio: { value: getDPR() },
          uResolution: { value: resolutionVec },
          uVanishingUv: { value: vanishingUvVec },
          uAspect: { value: window.innerWidth / Math.max(window.innerHeight, 1) },
          uStar0: { value: liveColors.star0 },
          uStar1: { value: liveColors.star1 },
          uStar2: { value: liveColors.star2 },
          uStar3: { value: liveColors.star3 },
          uHeadTint: { value: liveColors.headTint },
        };

        const mat = new THREE.ShaderMaterial({
          vertexShader: CAPSULE_STAR_VERT,
          fragmentShader: CAPSULE_STAR_FRAG,
          uniforms,
          side: THREE.DoubleSide,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthTest: false,
          depthWrite: false,
        });

        const mesh = new THREE.Mesh(geo, mat);
        mesh.frustumCulled = false;
        mesh.renderOrder = renderOrder;
        spaceScene.add(mesh);
        disposables.push(geo, mat);

        return { mesh, uniforms };
      }

      // Layer 1: Deep Background Stars (3,600 instances, continuously flows at bgStarSpeed)
      const layer1Deep = createCapsuleStarLayer({
        count: 3600,
        zMin: -420,
        zMax: -10,
        layerMode: 0.0,
        swirlRate: 0.0022,
        renderOrder: -30,
        populate(cylPos, meta, flags, weights, count, zSpan) {
          for (let i = 0; i < count; i++) {
            const zone = Math.random();
            let radius;
            if (zone < 0.28) radius = 0.8 + Math.pow(Math.random(), 0.72) * 58.0;
            else if (zone < 0.68) radius = 58.0 + Math.pow(Math.random(), 0.85) * 195.0;
            else radius = 253.0 + Math.pow(Math.random(), 0.90) * 340.0;

            cylPos[i * 3 + 0] = radius;
            cylPos[i * 3 + 1] = Math.random() * Math.PI * 2.0;
            cylPos[i * 3 + 2] = Math.random() * zSpan;

            const hasSpike = Math.random() < 0.11 ? 1.0 : 0.0;
            meta[i * 4 + 0] = hasSpike > 0.5
              ? (1.12 + Math.pow(Math.random(), 1.8) * 0.60)
              : (0.65 + Math.pow(Math.random(), 2.5) * 0.58);
            meta[i * 4 + 1] = 0.78 + Math.random() * 0.48;
            meta[i * 4 + 2] = 0.55 + Math.random() * 0.85;
            meta[i * 4 + 3] = Math.random();

            flags[i * 4 + 0] = hasSpike;
            flags[i * 4 + 1] = Math.random();
            flags[i * 4 + 2] = hasSpike > 0.5
              ? (0.76 + Math.random() * 0.34)
              : (0.28 + Math.pow(Math.random(), 1.7) * 0.56);
            flags[i * 4 + 3] = Math.random();

            writeSpectralWeights(weights, i, [0.35, 0.34, 0.19, 0.12]);
          }
        },
      });

      // Layer 2: Main Star Stream (2,800 instances)
      const layer2Main = createCapsuleStarLayer({
        count: 2800,
        zMin: -280,
        zMax: 0,
        layerMode: 1.0,

        populate(cylPos, meta, flags, weights, count, zSpan) {

            meta[i * 4 + 1] = 0.72 + Math.random() * 0.83;
            meta[i * 4 + 2] = 0.62 + Math.random() * 0.90;
            meta[i * 4 + 3] = Math.random();

            flags[i * 4 + 0] = hasSpike;
            flags[i * 4 + 1] = i / count;
            flags[i * 4 + 2] = hasSpike > 0.5
              ? (0.85 + Math.random() * 0.30)
              : (0.42 + Math.pow(Math.random(), 1.5) * 0.55);
            flags[i * 4 + 3] = Math.random();

            writeSpectralWeights(weights, i, [0.38, 0.33, 0.18, 0.11]);

        },
