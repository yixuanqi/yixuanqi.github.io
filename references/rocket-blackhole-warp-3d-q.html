<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D 圆头Q版小火箭 · 黑洞静谧跃迁</title>

  <!-- Tailwind CSS for minimalist glassmorphic interface -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Refined Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />

  <!-- Three.js 0.160.0 ES Module Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <style>
    :root {
      --accent: #6cb8ff;
      --accent-soft: rgba(108, 184, 255, 0.44);
      --accent-faint: rgba(108, 184, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #02040b;
      color: #eef3ff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .font-serif-poetic {
      font-family: 'Noto Serif SC', 'Songti SC', 'STSong', Georgia, serif;
    }

    .font-mono-fine {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }

    /* Full-Viewport WebGL Canvas */
    #cosmos-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
      cursor: default;
      z-index: 1;
    }

    #cosmos-canvas.rocket-hover {
      cursor: pointer;
    }

    /* Frosted Dark Glass Surface */
    .glass-surface {
      background: linear-gradient(155deg, rgba(8, 13, 28, 0.56), rgba(3, 5, 14, 0.78));
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border: 1px solid rgba(205, 224, 255, 0.12);
      box-shadow:
        0 14px 42px rgba(0, 0, 0, 0.56),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    /* Top-left Header Auto-Dim During Warp */
    #top-left-status {
      transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #top-left-status.is-dimmed {
      opacity: 0.56;
    }

    #top-left-status.is-dimmed:hover {
      opacity: 0.98;
    }

    /* Star Realm Name Crossfade */
    #realm-badge-inner {
      transition: opacity 0.55s ease, transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #realm-badge-inner.is-switching {
      opacity: 0.20;
      transform: translateY(-2px);
    }

    /* Bottom Subtle Caption & Hover Illumination */
    #rocket-caption {
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  color 0.35s ease,
                  text-shadow 0.35s ease;
    }

    #rocket-caption.is-illuminated #caption-main {
      color: #ffffff;
      text-shadow: 0 0 18px var(--accent-soft), 0 2px 10px rgba(0, 0, 0, 0.9);
    }

    #rocket-caption.is-hidden {
      opacity: 0;
      transform: translateY(6px);
    }

    /* Whisper-Thin Hairline Progress Bar During Warp */
    #warp-progress-wrap {
      width: 148px;
      height: 1.5px;
      background: rgba(205, 224, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.45s ease;
    }

    #warp-progress-wrap.is-visible {
      opacity: 1;
    }

    #warp-progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent 0%, var(--accent) 45%, #fffbf2 100%);
      box-shadow: 0 0 10px var(--accent);
    }

    /* Collapsible Visual Tuning Drawer */
    #params-drawer {
      transform-origin: top right;
      transition:
        opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.30s cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0.30s;
    }

    #params-drawer.is-collapsed {
      opacity: 0;
      transform: translateY(-8px) scale(0.97);
      visibility: hidden;
      pointer-events: none;
    }

    /* Star Realm Selector Chips */
    .realm-chip {
      border: 1px solid rgba(205, 224, 255, 0.11);
      background: rgba(255, 255, 255, 0.025);
      transition: all 0.25s ease;
    }

    .realm-chip:hover {
      background: rgba(255, 255, 255, 0.075);
      border-color: rgba(205, 224, 255, 0.28);
    }

    .realm-chip.active {
      background: rgba(255, 255, 255, 0.11);
      border-color: var(--accent-soft);
      box-shadow: 0 0 16px var(--accent-faint);
    }

    /* Minimalist Hairline Range Sliders */
    input[type='range'].cosmos-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 2px;
      border-radius: 999px;
      background: rgba(205, 224, 255, 0.18);
      outline: none;
      cursor: pointer;
    }

    input[type='range'].cosmos-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #f5f9ff;
      border: 1.5px solid var(--accent);
      box-shadow: 0 0 10px var(--accent-soft);
      transition: transform 0.16s ease, box-shadow 0.2s ease;
    }

    input[type='range'].cosmos-slider::-webkit-slider-thumb:hover {
      transform: scale(1.22);
      box-shadow: 0 0 14px var(--accent);
    }

    input[type='range'].cosmos-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #f5f9ff;
      border: 1.5px solid var(--accent);
      box-shadow: 0 0 10px var(--accent-soft);
      transition: transform 0.16s ease;
    }

    /* Clean Toggle Switch */
    .toggle-track {
      width: 34px;
      height: 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(210, 228, 255, 0.16);
      position: relative;
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .toggle-track[data-on="true"] {
      background: var(--accent-faint);
      border-color: var(--accent-soft);
    }

    .toggle-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(225, 236, 255, 0.72);
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), background 0.25s ease, box-shadow 0.25s ease;
    }

    .toggle-track[data-on="true"] .toggle-thumb {
      transform: translateX(16px);
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    /* Cinema Mode (H Key / Eye Toggle) */
    #hud-root {
      transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.ui-hidden #hud-root {
      opacity: 0;
      pointer-events: none;
    }

    body.ui-hidden #hud-root * {
      pointer-events: none !important;
    }

    #restore-ui-btn {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    body.ui-hidden #restore-ui-btn {
      pointer-events: auto;
      opacity: 0.24;
    }

    body.ui-hidden #restore-ui-btn:hover {
      opacity: 0.94;
    }
  </style>
</head>
<body>
  <!-- Full-Viewport Three.js WebGL Cosmos & 3D Rocket Canvas -->
  <canvas id="cosmos-canvas" aria-label="3D Q版小火箭黑洞静谧跃迁实时渲染画布"></canvas>

  <!-- WebGL Error Fallback Box -->
  <div id="error-overlay" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-[#02040b]/95 p-6">
    <div class="glass-surface max-w-md w-full rounded-2xl p-6 text-center space-y-3">
      <div class="text-[10px] font-mono-fine tracking-[0.28em] text-sky-200/75 uppercase">WebGL Initialization Error</div>
      <h2 class="text-base font-serif-poetic tracking-widest text-white">无法启动三维星空渲染管线</h2>
      <p id="error-message" class="text-xs text-slate-300/80 leading-relaxed">
        当前浏览器或设备暂不支持所需的 WebGL 渲染特性，请确认已开启硬件加速或使用新版现代浏览器。
      </p>
    </div>
  </div>

  <!-- Discreet Restore Button (Only Active when HUD is Hidden) -->
  <button
    id="restore-ui-btn"
    type="button"
    title="显示界面 (H)"
    aria-label="显示界面"
    class="glass-surface fixed top-5 right-5 z-30 rounded-full p-2.5 text-slate-200 cursor-pointer"
  >
    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
  </button>

  <!-- Clean Minimal Chinese HUD -->
  <div id="hud-root" class="fixed inset-0 z-20 pointer-events-none flex flex-col justify-between p-4 sm:p-7">

    <!-- Top Row: Left Refined Star Region & Phase Pill | Right Controls -->
    <div class="flex items-start justify-between gap-3">

      <!-- Top-Left: Subtle Glass Pill with Current Starfield Region & Phase Status -->
      <div id="top-left-status" class="pointer-events-auto select-none">
        <div class="glass-surface rounded-2xl px-3.5 py-2.5 sm:px-4 sm:py-2.5 space-y-1">
          <div class="flex items-center gap-2.5">
            <span id="phase-dot" class="inline-block w-1.5 h-1.5 rounded-full bg-sky-300 shadow-[0_0_8px_#6cb8ff]"></span>
            <div id="realm-badge-inner" class="flex items-baseline gap-2">
              <span id="realm-name-zh" class="font-serif-poetic text-xs sm:text-[13px] font-normal tracking-[0.20em] text-slate-100/95">
                苍穹蓝海
              </span>
              <span id="realm-name-en" class="text-[9px] font-mono-fine tracking-[0.20em] text-slate-400/65 uppercase hidden sm:inline">
                SAPPHIRE ABYSS
              </span>
            </div>
            <span class="h-3 w-px bg-slate-200/15"></span>
            <span id="phase-indicator" class="text-[11px] font-light tracking-[0.14em] text-slate-300/85">
              静谧星海
            </span>
          </div>
        </div>
      </div>

      <!-- Top-Right: Hide/Show Eye Button (H) + Visual Parameter Drawer Toggle -->
      <div class="relative flex flex-col items-end pointer-events-auto">
        <div class="flex items-center gap-2">
          <button
            id="hide-ui-btn"
            type="button"
            title="隐藏界面 (H)"
            aria-label="隐藏界面"
            class="glass-surface rounded-full p-2.5 text-slate-300/80 hover:text-white hover:border-slate-200/30 transition-all cursor-pointer"
          >
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
              <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
              <line x1="2" y1="2" x2="22" y2="22"></line>
            </svg>
          </button>

          <button
            id="toggle-params-btn"
            type="button"
            aria-expanded="false"
            aria-controls="params-drawer"
            class="glass-surface rounded-full px-3.5 py-2 flex items-center gap-2 text-xs text-slate-200/90 hover:text-white hover:border-slate-200/30 transition-all cursor-pointer"
          >
            <svg class="w-3.5 h-3.5 opacity-80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="7" x2="20" y2="7"></line>
              <circle cx="9" cy="7" r="1.8"></circle>
              <line x1="4" y1="12" x2="20" y2="12"></line>
              <circle cx="15" cy="12" r="1.8"></circle>
              <line x1="4" y1="17" x2="20" y2="17"></line>
              <circle cx="10" cy="17" r="1.8"></circle>
            </svg>
            <span class="tracking-[0.14em] font-light">视觉微调</span>
          </button>
        </div>

        <!-- Collapsible Frosted-Glass Parameter Drawer -->
        <aside
          id="params-drawer"
          class="is-collapsed glass-surface mt-2.5 w-[288px] sm:w-[314px] rounded-2xl p-4 sm:p-5 space-y-4 max-h-[78vh] overflow-y-auto"
        >
          <div class="flex items-center justify-between">
            <div>
              <div class="text-xs font-serif-poetic tracking-[0.2em] text-slate-100">视觉微调 · 3D 跃迁</div>
              <div class="text-[9px] font-mono-fine tracking-[0.20em] text-slate-400/75 uppercase mt-0.5">3D Rocket &amp; Optics</div>
            </div>
            <button
              id="reset-params-btn"
              type="button"
              class="text-[10px] tracking-wider text-slate-300/75 hover:text-white px-2 py-1 rounded-lg bg-white/[0.04] hover:bg-white/[0.09] transition-colors cursor-pointer"
            >
              重置
            </button>
          </div>

          <!-- 4 Curated Starfield Regions -->
          <div class="space-y-2">
            <div class="flex items-center justify-between text-[11px] text-slate-300/85">
              <span class="tracking-wider">星域主题</span>
              <span class="text-[9px] font-mono-fine tracking-widest text-slate-400/65 uppercase">Star Realm</span>
            </div>
            <div class="grid grid-cols-2 gap-1.5">
              <button type="button" data-realm="0" class="realm-chip active rounded-xl py-2 px-2.5 flex items-center gap-2 cursor-pointer">
                <span class="w-3 h-3 rounded-full shrink-0 bg-gradient-to-tr from-[#071d54] via-[#4ea8ff] to-[#ffe6b3] shadow-[0_0_8px_rgba(78,168,255,0.55)]"></span>
                <span class="text-[11px] text-slate-100/95 tracking-wider">苍穹蓝海</span>
              </button>
              <button type="button" data-realm="1" class="realm-chip rounded-xl py-2 px-2.5 flex items-center gap-2 cursor-pointer">
                <span class="w-3 h-3 rounded-full shrink-0 bg-gradient-to-tr from-[#24112e] via-[#f2a8bd] to-[#ffd28a] shadow-[0_0_8px_rgba(255,210,138,0.55)]"></span>
                <span class="text-[11px] text-slate-100/95 tracking-wider">暮色琥珀</span>
              </button>
              <button type="button" data-realm="2" class="realm-chip rounded-xl py-2 px-2.5 flex items-center gap-2 cursor-pointer">
                <span class="w-3 h-3 rounded-full shrink-0 bg-gradient-to-tr from-[#130b38] via-[#ab7dff] to-[#91dbff] shadow-[0_0_8px_rgba(171,125,255,0.55)]"></span>
                <span class="text-[11px] text-slate-100/95 tracking-wider">紫微星河</span>
              </button>
              <button type="button" data-realm="3" class="realm-chip rounded-xl py-2 px-2.5 flex items-center gap-2 cursor-pointer">
                <span class="w-3 h-3 rounded-full shrink-0 bg-gradient-to-tr from-[#052930] via-[#4ae8c2] to-[#87ceff] shadow-[0_0_8px_rgba(74,232,194,0.55)]"></span>
                <span class="text-[11px] text-slate-100/95 tracking-wider">极光寒穹</span>
              </button>
            </div>

            <!-- Auto-Switch Realm Toggle -->
            <button
              id="auto-realm-toggle"
              type="button"
              role="switch"
              aria-checked="true"
              class="w-full pt-1.5 flex items-center justify-between text-[11px] text-slate-300/85 hover:text-white transition-colors cursor-pointer"
            >
              <span class="tracking-wide">每次跃迁自动切换星域</span>
              <span id="auto-realm-track" class="toggle-track" data-on="true">
                <span class="toggle-thumb"></span>
              </span>
            </button>
          </div>

          <div class="h-px bg-white/[0.08]"></div>

          <!-- 8 Optical & Motion Sliders -->
          <div class="space-y-3 text-[11px]">
            <div class="space-y-1.5">
              <div class="flex justify-between items-center">
                <span class="text-slate-200/90 tracking-wide">光丝长度</span>
                <span id="val-streak" class="font-mono-fine text-[10px] text-slate-300/85">1.05</span>
              </div>
              <input id="slider-streak" type="range" min="0.45" max="1.90" step="0.05" value="1.05" class="cosmos-slider" />
            </div>

            <div class="space-y-1.5">
              <div class="flex justify-between items-center">
                <span class="text-slate-200/90 tracking-wide">背景星流速</span>
                <span id="val-bgflow" class="font-mono-fine text-[10px] text-slate-300/85">0.24x</span>
              </div>
              <input id="slider-bgflow" type="range" min="0.08" max="0.55" step="0.02" value="0.24" class="cosmos-slider" />
            </div>

            <div class="space-y-1.5">
              <div class="flex justify-between items-center">
                <span class="text-slate-200/90 tracking-wide">星流密度</span>
                <span id="val-density" class="font-mono-fine text-[10px] text-slate-300/85">1.00</span>
              </div>
              <input id="slider-density" type="range" min="0.35" max="1.00" step="0.05" value="1.00" class="cosmos-slider" />
            </div>

            <div class="space-y-1.5">
              <div class="flex justify-between items-center">
                <span class="text-slate-200/90 tracking-wide">跃迁广角</span>
                <span id="val-maxfov" class="font-mono-fine text-[10px] text-slate-300/85">110°</span>
              </div>
              <input id="slider-maxfov" type="range" min="85" max="122" step="1" value="110" class="cosmos-slider" />
            </div>

            <div class="space-y-1.5">
              <div class="flex justify-between items-center">
                <span class="text-slate-200/90 tracking-wide">柔焦星晕</span>
                <span id="val-bloom" class="font-mono-fine text-[10px] text-slate-300/85">0.72</span>
              </div>
              <input id="slider-bloom" type="range" min="0.00" max="1.50" step="0.02" value="0.72" class="cosmos-slider" />
            </div>

            <div class="space-y-1.5">
              <div class="flex justify-between items-center">
                <span class="text-slate-200/90 tracking-wide">时空薄纱</span>
                <span id="val-veil" class="font-mono-fine text-[10px] text-slate-300/85">0.14</span>
              </div>
              <input id="slider-veil" type="range" min="0.00" max="0.35" step="0.01" value="0.14" class="cosmos-slider" />
            </div>

            <div class="space-y-1.5">
              <div class="flex justify-between items-center">
                <span class="text-slate-200/90 tracking-wide">引力波纹</span>
                <span id="val-ripple" class="font-mono-fine text-[10px] text-slate-300/85">1.00</span>
              </div>
              <input id="slider-ripple" type="range" min="0.00" max="1.80" step="0.05" value="1.00" class="cosmos-slider" />
            </div>

            <div class="space-y-1.5">
              <div class="flex justify-between items-center">
                <span class="text-slate-200/90 tracking-wide">边缘色散</span>
                <span id="val-chromatic" class="font-mono-fine text-[10px] text-slate-300/85">0.42</span>
              </div>
              <input id="slider-chromatic" type="range" min="0.00" max="1.50" step="0.05" value="0.42" class="cosmos-slider" />
            </div>
          </div>
        </aside>
      </div>
    </div>

    <!-- Bottom-Center: Ultra-Clean Prompt Directly Beneath 3D Rocket + Hairline Warp Progress -->
    <div class="flex flex-col items-center gap-2 pb-1 sm:pb-2">
      <div id="warp-progress-wrap" aria-hidden="true">
        <div id="warp-progress-bar"></div>
      </div>

      <div id="rocket-caption" class="flex flex-col items-center gap-1 text-center">
        <span id="caption-main" class="font-serif-poetic text-xs sm:text-[13px] tracking-[0.26em] text-slate-200/85 drop-shadow-[0_2px_10px_rgba(0,0,0,0.92)]">
          点击小火箭跃迁
        </span>
        <span class="text-[10px] font-light tracking-[0.14em] text-slate-300/45 drop-shadow-[0_1px_6px_rgba(0,0,0,0.88)]">
          空格起飞 · 空白处长按或巡航按住延长 · H 隐藏界面
        </span>
      </div>
    </div>
  </div>

  <!-- Main Three.js (0.160.0) + Custom GLSL + Procedural 3D Q-Rocket & Black Hole Engine -->
  <script type="module">
    import * as THREE from 'three';

    // ============================================================================
    // 1. FOUR CURATED STARFIELD THEMES & DEFAULT PARAMETERS
    // ============================================================================
    const REALMS = [
      {
        zh: '苍穹蓝海',
        en: 'SAPPHIRE ABYSS',
        cssAccent: '#6cb8ff',
        cssSoft: 'rgba(108, 184, 255, 0.44)',
        cssFaint: 'rgba(108, 184, 255, 0.15)',
        rimLight: new THREE.Color('#78B8FF'),
        skyDeep: new THREE.Color('#02040b'),
        skyMid: new THREE.Color('#051029'),
        nebulaA: new THREE.Color('#0d2660'),
        nebulaB: new THREE.Color('#1a174d'),
        veilA: new THREE.Color('#1848a8'),
        veilB: new THREE.Color('#47b5ff'),
        vpGlow: new THREE.Color('#0d2864'),
        bhDiskInner: new THREE.Color('#ffe7bc'),
        bhDiskOuter: new THREE.Color('#4aa8ff'),

    const COSMOS_BACKDROP_FRAG = /* glsl */ `
      precision highp float;

      uniform float uTime;
      uniform float uDrift;
      uniform float uFlow;
      uniform float uWarp;
      uniform float uVeilOpacity;
      uniform float uAspect;
      uniform float uTanHalfFov;
      uniform vec2  uVanishingOffset;
      uniform vec3  uCamRight;
      uniform vec3  uCamUp;
      uniform vec3  uCamForward;

      uniform vec3  uSkyDeep;
      uniform vec3  uSkyMid;
      uniform vec3  uNebulaA;
      uniform vec3  uNebulaB;
      uniform vec3  uVeilA;
      uniform vec3  uVeilB;
      uniform vec3  uVpGlow;

      varying vec2 vUv;

      // Ashima 3D Simplex Noise
      vec4 permute(vec4 x) { return mod(((x * 34.0) + 1.0) * x, 289.0); }
      vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

      float snoise(vec3 v) {
        const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i  = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);

        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);

        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;

        i = mod(i, 289.0);
        vec4 p = permute(permute(permute(
                  i.z + vec4(0.0, i1.z, i2.z, 1.0))
                + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                + i.x + vec4(0.0, i1.x, i2.x, 1.0));

        float n_ = 1.0 / 7.0;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);

        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);

        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);

        vec4 s0 = floor(b0) * 2.0 + 1.0;
        vec4 s1 = floor(b1) * 2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));

        vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;

        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);

        vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;

        vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
      }

      float fbm4(vec3 p) {
        float val = 0.0;
        float amp = 0.5;
        for (int i = 0; i < 4; i++) {
          val += amp * (snoise(p) * 0.5 + 0.5);
          p = p * 2.03 + vec3(11.3, -6.7, 3.9);
          amp *= 0.5;
        }
        return val;
      }

      float fbm3(vec3 p) {
        float val = 0.0;
        float amp = 0.5;
        for (int i = 0; i < 3; i++) {
          val += amp * (snoise(p) * 0.5 + 0.5);
          p = p * 2.05 + vec3(7.1, -4.9, 2.3);
          amp *= 0.5;
        }
        return val;
      }

      void main() {
        vec2 ndc = vUv * 2.0 - 1.0;
        vec3 ray = uCamForward
          + uCamRight * (ndc.x * uAspect * uTanHalfFov)
          + uCamUp * (ndc.y * uTanHalfFov);
        ray /= max(length(ray), 0.0001);

        vec2 pVP = (vUv - 0.5) * vec2(uAspect, 1.0) - uVanishingOffset;
        float rVP = length(pVP);
        float angleVP = atan(pVP.y, pVP.x);

        float zenith = smoothstep(-0.85, 0.85, ray.y);
        vec3 col = mix(uSkyMid * 0.65, uSkyDeep, zenith);

        // Domain-warped velvet-dark cosmic nebula
        float plane = dot(ray, normalize(vec3(0.36, 0.89, 0.28)));
        float galacticBand = exp(-plane * plane * 4.6);

        vec3 stretchRay = vec3(ray.xy * (1.0 - uWarp * 0.18), ray.z * (1.0 + uWarp * 0.30));
        vec3 pNeb = stretchRay * 2.1 + vec3(0.0, uTime * 0.004, -uDrift * 0.15);
        float n1 = fbm4(pNeb);
        vec3 warpOff = vec3((n1 - 0.5) * 1.15, (0.5 - n1) * 0.95, -uDrift * 0.06);
        float n2 = fbm4(pNeb * 1.48 + warpOff);

        float wispA = smoothstep(0.34, 0.86, n1 * 0.52 + n2 * 0.56) * (0.42 + 0.65 * galacticBand);
        float wispB = pow(max(smoothstep(0.38, 0.90, n2), 0.0001), 2.2) * (0.36 + 0.70 * galacticBand);

        vec3 nebula = uNebulaA * wispA * 0.24 + uNebulaB * wispB * 0.20;
        col += clamp(nebula, vec3(0.0), vec3(0.105));

        // Ultra-delicate translucent gossamer spacetime veil visible only during warp
        if (uVeilOpacity > 0.001) {
          float zDepth = 1.25 / (rVP + 0.12);
          float swirl1 = angleVP + zDepth * 0.18 - uTime * 0.11;
          vec3 cyl1 = vec3(cos(swirl1) * 1.5, sin(swirl1) * 1.5, zDepth * 0.28 - uFlow * 0.80);
          float silkBroad = fbm3(cyl1);

          float swirl2 = angleVP - zDepth * 0.14 + uTime * 0.09;
          vec3 cyl2 = vec3(cos(swirl2) * 2.9, sin(swirl2) * 2.9, zDepth * 0.15 - uFlow * 1.60);
          float silkStream = fbm3(cyl2 + vec3((silkBroad - 0.5) * 1.05, (0.5 - silkBroad) * 0.90, 0.0));

          float curtain = smoothstep(0.32, 0.86, silkBroad) * 0.48;
          float currents = pow(max(smoothstep(0.45, 0.91, silkStream), 0.0001), 2.3) * 0.88;

          float radialVeilMask = smoothstep(0.07, 0.48, rVP) * (0.78 + 0.30 * smoothstep(0.35, 1.05, rVP));
          vec3 veilCol = (uVeilA * curtain + uVeilB * currents) * radialVeilMask * uVeilOpacity;
          col += clamp(veilCol, vec3(0.0), vec3(0.16));
        }

        // Subtle deep sapphire vanishing depth glow (never white)
        float vpInner = exp(-rVP * rVP * 24.0);
        float vpOuter = exp(-rVP * rVP * 4.8);
        col += uVpGlow * (vpInner * 0.38 + vpOuter * 0.52) * (0.12 + uWarp * 0.28);

        gl_FragColor = vec4(col, 1.0);
      }
    `;

    // ----------------------------------------------------------------------------
    // 2B. Analytical 2D Capsule SDF in Exact Physical Screen Pixel Space
    //     - Used by ALL 3 continuous dynamic star layers (ZERO static background stars)
    //     - View-space near-plane clipping (nearZ = -0.35) BEFORE perspective projection
    //     - Minimum half-width >= 4.8 physical pixels -> ZERO WebGL dropout/dashed lines
    //     - Razor-sharp pinpoint stars & screen-aligned 4-point diffraction spikes at rest
    //     - Energy conservation & gemstone hue gradient along streaks during warp
    // ----------------------------------------------------------------------------
    const CAPSULE_STAR_VERT = /* glsl */ `
      attribute vec3 aCylPos;       // (radius, angle, initialZ)
      attribute vec4 aMeta;         // (idleCoreCssPx, speedMult, tailScale, phase)
      attribute vec4 aFlags;        // (hasSpike, densityRank, magBrightness, radialFadeSeed)
      attribute vec4 aColorWeights; // 4-way active realm gemstone color weights

      uniform float uTime;
      uniform float uTravelDist;
      uniform float uZMin;
      uniform float uZMax;
      uniform float uStretchWorld;
      uniform float uWarpMix;
      uniform float uCharge;
      uniform float uDensityCutoff;
      uniform float uLayerMode;     // 0 = Deep-space, 1 = Main streams, 2 = Peripheral fast streaks
      uniform float uSwirlRate;
      uniform float uPixelRatio;
      uniform vec2  uResolution;
      uniform vec2  uVanishingUv;
      uniform float uAspect;

      uniform vec3  uStar0;
      uniform vec3  uStar1;
      uniform vec3  uStar2;
      uniform vec3  uStar3;

      varying float vAlongPx;
      varying float vAcrossPx;
      varying float vSegLenPx;
      varying float vCoreRadiusPx;
      varying vec3  vColor;
      varying float vAlpha;
      varying float vTwinkle;
      varying float vHasSpike;
      varying float vWarpMix;
      varying float vHeadClipped;
      varying vec2  vDirPx;
      varying vec2  vQuadUV;

      void main() {
        float densityVis = 1.0;
        if (uLayerMode > 0.5 && uLayerMode < 1.5) {
          densityVis = smoothstep(uDensityCutoff, uDensityCutoff - 0.10, aFlags.y);
        }
        if (densityVis < 0.002) {
          gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
          return;
        }

        // Camera looks down -Z; stars continuously advance toward +Z
        float zSpan = max(uZMax - uZMin, 1.0);
        float zHead = uZMin + mod(aCylPos.z + uTravelDist * aMeta.y, zSpan);
        float streakWorldLen = uStretchWorld * aMeta.z;
        float zTail = zHead - streakWorldLen;

        float radius = aCylPos.x;
        float angle = aCylPos.y + uTime * uSwirlRate * (0.45 + 0.55 * aMeta.y);
        float cx = cos(angle) * radius;
        float cy = sin(angle) * radius;

        vec3 vHead = (modelViewMatrix * vec4(cx, cy, zHead, 1.0)).xyz;
        vec3 vTail = (modelViewMatrix * vec4(cx, cy, zTail, 1.0)).xyz;

        // STRICT view-space near-plane clipping (nearZ = -0.35) BEFORE projection
        const float nearZ = -0.35;
        if (vHead.z > nearZ && vTail.z > nearZ) {
          gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
          return;
        }

        float headClipped = 0.0;
        if (vHead.z > nearZ && vTail.z <= nearZ) {
          float t = clamp((nearZ - vTail.z) / max(vHead.z - vTail.z, 0.0001), 0.0, 1.0);
          vHead = mix(vTail, vHead, t);
          headClipped = 1.0;
        } else if (vTail.z > nearZ && vHead.z <= nearZ) {
          float t = clamp((nearZ - vHead.z) / max(vTail.z - vHead.z, 0.0001), 0.0, 1.0);
          vTail = mix(vHead, vTail, t);
        }

        vec4 cHead = projectionMatrix * vec4(vHead, 1.0);
        vec4 cTail = projectionMatrix * vec4(vTail, 1.0);

        vec2 ndcHead = cHead.xy / max(cHead.w, 0.0001);
        vec2 ndcTail = cTail.xy / max(cTail.w, 0.0001);

        if ((ndcHead.x < -1.55 && ndcTail.x < -1.55) || (ndcHead.x > 1.55 && ndcTail.x > 1.55) ||
            (ndcHead.y < -1.55 && ndcTail.y < -1.55) || (ndcHead.y > 1.55 && ndcTail.y > 1.55)) {
          gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
          return;
        }

        vec2 pxHead = ndcHead * 0.5 * uResolution;
        vec2 pxTail = ndcTail * 0.5 * uResolution;

        vec2 deltaPx = pxHead - pxTail;
        float segLenPx = length(deltaPx);
        vec2 dirPx = segLenPx > 0.001 ? (deltaPx / segLenPx) : vec2(1.0, 0.0);
        vec2 perpPx = vec2(-dirPx.y, dirPx.x);

        float depth = max(-vHead.z, 1.0);
        float depthBoost = clamp(95.0 / (depth + 55.0), 0.72, 1.28);

        float idleCorePx = clamp(aMeta.x * depthBoost, 0.65, 1.80) * uPixelRatio;
        float streakCorePx = clamp(aMeta.x * 0.72 * depthBoost, 0.55, 1.15) * uPixelRatio;
        float streakWeight = smoothstep(0.5 * uPixelRatio, 8.0 * uPixelRatio, segLenPx);
        float coreRadiusPx = mix(idleCorePx, streakCorePx, max(uWarpMix * 0.75, streakWeight));

        // Guaranteed minimum screen-space half-width >= 4.8 physical pixels (zero dashed aliasing!)
        // Generous resting padding ensures soft star halo & diffraction spikes fade cleanly to 0 inside quad
        float minHalfWidthPx = max(4.8, 2.6 * uPixelRatio);
        float idlePad = aFlags.x > 0.5
          ? max(coreRadiusPx * 11.5, 16.5 * uPixelRatio)
          : max(coreRadiusPx * 7.5, max(8.5 * uPixelRatio, minHalfWidthPx));
        float streakPad = max(coreRadiusPx * 5.2, max(6.0 * uPixelRatio, minHalfWidthPx));
        float quadPadPx = mix(idlePad, streakPad, streakWeight);

        // Right-handed quad expansion (position.x along dirPx, position.y along perpPx)
        float alongPx = mix(-quadPadPx, segLenPx + quadPadPx, position.x + 0.5);
        float acrossPx = position.y * 2.0 * quadPadPx;
        vec2 finalPx = pxTail + dirPx * alongPx + perpPx * acrossPx;

        gl_Position = vec4(finalPx / (0.5 * uResolution), 0.0, 1.0);
        vQuadUV = position.xy * 2.0;

        float farFade = smoothstep(uZMin, uZMin + zSpan * 0.24, zHead);
        float nearFade = uLayerMode < 0.5
          ? (1.0 - smoothstep(uZMax - 36.0, uZMax - 2.0, zHead))
          : (1.0 - smoothstep(uZMax - 18.0, uZMax - 1.2, zHead));

        // Smooth radial vanishing-point emergence fade during warp only (no center cutout ring!)
        float radialEmerge = smoothstep(0.35, 3.8, radius);
        vec2 midUv = mix(ndcTail, ndcHead, 0.65) * 0.5 + 0.5;
        float distVP = length((midUv - uVanishingUv) * vec2(uAspect, 1.0));
        float vpSoft = smoothstep(0.012 + aFlags.w * 0.025, 0.16 + aFlags.w * 0.07, distVP);
        float vpCrowd = 0.45 + 0.55 * smoothstep(0.06, 0.44, distVP);
        float emergenceGate = mix(1.0, radialEmerge * vpSoft * vpCrowd, streakWeight * (uLayerMode < 0.5 ? 0.55 : 0.95));

        float tw1 = sin(uTime * (1.35 + aMeta.y * 1.25) + aMeta.w * 6.2831);
        float tw2 = sin(uTime * (2.75 + aMeta.z * 1.45) + aMeta.w * 15.3);
        float twinkle = 0.72 + 0.28 * (tw1 * 0.65 + tw2 * 0.35);
        float chargeLift = 1.0 + uCharge * (uLayerMode < 0.5 ? 0.30 : 0.42);

        vAlongPx = alongPx;
        vAcrossPx = acrossPx;
        vSegLenPx = segLenPx;
        vCoreRadiusPx = coreRadiusPx;
        vColor = uStar0 * aColorWeights.x
               + uStar1 * aColorWeights.y
               + uStar2 * aColorWeights.z
               + uStar3 * aColorWeights.w;
        vAlpha = farFade * nearFade * emergenceGate * aFlags.z * densityVis * chargeLift;
        vTwinkle = mix(twinkle, 0.92 + 0.08 * tw1, streakWeight);
        vHasSpike = aFlags.x;
        vWarpMix = max(uWarpMix, streakWeight);
        vHeadClipped = headClipped;
        vDirPx = dirPx;
      }
    `;

    const CAPSULE_STAR_FRAG = /* glsl */ `
      precision highp float;

      uniform float uPixelRatio;
      uniform vec3  uHeadTint;

      varying float vAlongPx;
      varying float vAcrossPx;
      varying float vSegLenPx;
      varying float vCoreRadiusPx;
      varying vec3  vColor;
      varying float vAlpha;
      varying float vTwinkle;
      varying float vHasSpike;
      varying float vWarpMix;
      varying float vHeadClipped;
      varying vec2  vDirPx;
      varying vec2  vQuadUV;

      void main() {
        if (vAlpha < 0.002) discard;

        // Smooth circular window when resting & exact-zero edge taper when streaking
        // Completely eliminates any faint square bounding-box clipping around stars!
        float streakWindowMix = smoothstep(0.5 * uPixelRatio, 6.0 * uPixelRatio, vSegLenPx);
        float radialWindow = smoothstep(1.0, 0.42, length(vQuadUV));
        float streakWindow = smoothstep(1.0, 0.52, abs(vQuadUV.x)) * smoothstep(1.0, 0.42, abs(vQuadUV.y));
        float quadWindow = mix(radialWindow, streakWindow, streakWindowMix);
        if (quadWindow < 0.001) discard;

        float clampedAlong = clamp(vAlongPx, 0.0, vSegLenPx);
        float distPx = length(vec2(vAlongPx - clampedAlong, vAcrossPx));
        float tAlong = vSegLenPx > 0.05 ? clamp(clampedAlong / vSegLenPx, 0.0, 1.0) : 1.0;

        float taper = mix(1.0, mix(0.45, 1.0, pow(max(tAlong, 0.0001), 0.60)), vWarpMix);
        float localCore = vCoreRadiusPx * taper;

        float effCore = max(localCore, 0.58);
        float aaConservation = clamp(localCore / effCore, 0.48, 1.0);

        // Gaussian core + Gaussian halo (decays cleanly to zero well before quad edge)
        float core = exp(-pow(distPx / effCore, 2.0)) * aaConservation;
        float halo = 0.24 * exp(-pow(distPx / max(effCore * 2.45, 1.05), 2.0)) * aaConservation;

        // Crisp screen-aligned 4-point diffraction cross spikes on brightest stars when stationary
        float spikes = 0.0;
        float spikeMask = 1.0 - smoothstep(0.6 * uPixelRatio, 6.0 * uPixelRatio, vSegLenPx);
        if (vHasSpike > 0.5 && spikeMask > 0.005) {
          vec2 localFromHead = vec2(vAlongPx - vSegLenPx, vAcrossPx);
          vec2 screenFromHead = vec2(
            vDirPx.x * localFromHead.x - vDirPx.y * localFromHead.y,
            vDirPx.y * localFromHead.x + vDirPx.x * localFromHead.y
          );
          vec2 cssDelta = screenFromHead / max(uPixelRatio, 1.0);
          vec2 rp = mat2(0.978, -0.208, 0.208, 0.978) * cssDelta;
          float spikeSpan = clamp((vCoreRadiusPx / max(uPixelRatio, 1.0)) * 5.2, 4.4, 9.8);
          float spH = exp(-abs(rp.y) * 3.6) * exp(-abs(rp.x) / (spikeSpan * 0.42)) * smoothstep(spikeSpan * 1.25, 0.0, abs(rp.x));

    const LENSING_BLACKHOLE_FRAG = /* glsl */ `
      precision highp float;

      uniform sampler2D tSpace;
      uniform vec2  uBlackHoleUV;       // Exact projected 3D anchor (0, 0.25, -14.5) in UV
      uniform vec2  uVanishingUV;       // Projected tunnel vanishing point in UV
      uniform float uAspect;
      uniform float uTime;
      uniform float uBlackHoleScale;    // Perspective-consistent screen horizon radius
      uniform float uBlackHoleVis;      // 0..1 visibility envelope
      uniform float uBlackHoleLens;     // 0..1 Einstein-ring deflection strength
      uniform float uChargePulse;       // Singularity contraction pulse 0..1
      uniform float uAbsorbPulse;       // Rocket entry photon-ring absorption ripple 0..1
      uniform vec3  uDiskInner;         // Warm golden-white inner photon tint
      uniform vec3  uDiskOuter;         // Active realm outer accretion tint
      uniform float uRippleScale;       // User ripple intensity multiplier
      uniform vec2  uRipple1;           // (progress 0..1, strength) breakthrough wave
      uniform vec2  uRipple2;           // (progress 0..1, strength) arrival wave
      uniform vec3  uAccentColor;

      varying vec2 vUv;

      // Ashima 3D Simplex Noise for seamless swirling accretion disk & halo arcs
      vec4 permute(vec4 x) { return mod(((x * 34.0) + 1.0) * x, 289.0); }
      vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

      float snoise(vec3 v) {
        const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i  = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod(i, 289.0);
        vec4 p = permute(permute(permute(
                  i.z + vec4(0.0, i1.z, i2.z, 1.0))
                + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 1.0 / 7.0;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0) * 2.0 + 1.0;
        vec4 s1 = floor(b1) * 2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
      }

      float fbm3(vec3 p) {
        float v = 0.0;
        float a = 0.5;
        for (int i = 0; i < 3; i++) {
          v += a * (snoise(p) * 0.5 + 0.5);
          p = p * 2.05 + vec3(5.7, -3.9, 2.1);

        vec2 ripple,
        float dist,
        vec2 radialUvDir,
        inout vec2 refractUv,
        inout vec2 prismUv,
        inout float crestSheen
      ) {

        float str  = ripple.y * uRippleScale;
        if (str < 0.001 || prog <= 0.001 || prog >= 0.999) return;

        float ringR = prog * 1.48;
        float width = 0.044 + prog * 0.056;
        float d = dist - ringR;
        float normD = d / max(width, 0.001);

        float fadeIn  = smoothstep(0.0, 0.08, prog);
        float fadeOut = 1.0 - smoothstep(0.65, 1.0, prog);
        float gauss   = exp(-normD * normD);

        prismUv    += radialUvDir * (env * 0.0105);

      void main() {

        vec2 vpAspectVec = vpOff * vec2(uAspect, 1.0);
        float vpDist = length(vpAspectVec);

        vec2 vpRadUv = vec2(vpRadAspect.x / max(uAspect, 0.001), vpRadAspect.y);

        vec2 totalRefract = vec2(0.0);
        vec2 totalPrism = vec2(0.0);

        evalWarpRipple(uRipple1, vpDist, vpRadUv, totalRefract, totalPrism, rippleSheen);
        evalWarpRipple(uRipple2, vpDist, vpRadUv, totalRefract, totalPrism, rippleSheen);

        // 2) Evaluate Black Hole Einstein-ring gravitational deflection around uBlackHoleUV
        vec2 bhOff = vUv - uBlackHoleUV;
        vec2 bhAspectVec = bhOff * vec2(uAspect, 1.0);
        float bhDist = length(bhAspectVec);
        vec2 bhRadAspect = bhDist > 0.0001 ? (bhAspectVec / bhDist) : vec2(0.0);
        vec2 bhRadUv = vec2(bhRadAspect.x / max(uAspect, 0.001), bhRadAspect.y);

        float R = max(uBlackHoleScale, 0.0005);
        if (uBlackHoleLens > 0.0005 && uBlackHoleScale > 0.001) {
          float deflect = uBlackHoleLens * (R * R) * 1.48 / (bhDist + R * 0.35);
          float outerEnv = exp(-pow(bhDist / max(R * 5.8, 0.06), 1.55));
          float dAmt = deflect * outerEnv;
          totalRefract -= bhRadUv * dAmt;

          float nearSphere = exp(-pow((bhDist - R * 1.25) / max(R * 0.95, 0.02), 2.0));
          totalPrism += bhRadUv * (dAmt * 0.068 * nearSphere);
        }

        // Sample spaceRT (exact 1:1 pixel tap when idle for razor-sharp stationary stars!)
        vec3 col;

          vec2 sUv = vUv + totalRefract;
          col.r = texture2D(tSpace, clamp(sUv + totalPrism, 0.001, 0.999)).r;
          col.g = texture2D(tSpace, clamp(sUv, 0.001, 0.999)).g;
          col.b = texture2D(tSpace, clamp(sUv - totalPrism, 0.001, 0.999)).b;
        } else {
          col = texture2D(tSpace, vUv).rgb;
        }

        col += mix(uAccentColor, vec3(0.95, 0.98, 1.0), 0.30) * rippleSheen;

        // 3) Render Miniature 3D Gargantua Black Hole (velvet horizon, photon ring, swirling FBM disk)

          float maxReach = R * 5.2;
          if (bhDist < maxReach) {
            float edgeMask = 1.0 - smoothstep(maxReach * 0.68, maxReach, bhDist);

            // Subtle serene tilt (-13 deg)
            float ct = 0.9744;
            float st = -0.2250;
            vec2 rp = vec2(ct * bhAspectVec.x - st * bhAspectVec.y, st * bhAspectVec.x + ct * bhAspectVec.y);
            float angle = atan(rp.y, rp.x);

            // Pure velvet-black circular event horizon core
            float coreOcclusion = (1.0 - smoothstep(R * 0.93, R * 1.03, bhDist)) * uBlackHoleVis;

            // Crisp luminous golden-white / theme-tinted photon ring
            float ringDist = (bhDist - R * 1.045) / max(R * 0.078, 0.002);
            float photonRing = exp(-ringDist * ringDist);
            float photonHalo = exp(-pow((bhDist - R * 1.08) / max(R * 0.28, 0.006), 2.0)) * 0.42;
            float doppler = 0.84 + 0.24 * cos(angle + 2.35);

            // Gravitational-lensed upper & lower light halo arcs
            float arcR = length(vec2(rp.x * 0.96, rp.y * 1.05));
            float arcBand = exp(-pow((arcR - R * 1.24) / max(R * 0.42, 0.008), 2.0));
            float verticalBias = smoothstep(0.08, 0.72, abs(sin(angle)));
            float swirlA = angle - uTime * 1.35 + (R * 1.4) / max(arcR, R * 0.4);
            float arcTex = fbm3(vec3(cos(swirlA) * 2.2, sin(swirlA) * 2.2, (arcR / R) * 1.1 - uTime * 0.55));
            float lensedArcs = arcBand * verticalBias * (0.45 + 0.85 * pow(max(arcTex, 0.0001), 1.5)) * smoothstep(R * 0.92, R * 1.08, bhDist);

            // Tilted rotating multi-octave FBM equatorial accretion disk
            vec2 diskP = vec2(rp.x, rp.y * 3.35);
            float rDisk = length(diskP);
            float diskRadial = smoothstep(R * 0.96, R * 1.38, rDisk) * exp(-max(0.0, rDisk - R * 1.38) / max(R * 1.42, 0.02));
            float diskAngle = atan(diskP.y, diskP.x);
            float swirlD = diskAngle - uTime * 2.15 + (R * 2.2) / max(rDisk, R * 0.35);
            float diskFbm = fbm3(vec3(cos(swirlD) * 2.5, sin(swirlD) * 2.5, (rDisk / R) * 1.2 - uTime * 0.9));
            float diskFilaments = pow(max(smoothstep(0.24, 0.88, diskFbm), 0.0001), 1.65);

            float frontHalf = smoothstep(0.04 * R, -0.05 * R, rp.y);
            float behindMask = smoothstep(R * 0.94, R * 1.06, bhDist);
            float diskVis = mix(behindMask, 1.0, frontHalf * 0.85);
            float accretionDisk = diskRadial * (0.36 + 0.95 * diskFilaments) * diskVis * (0.82 + 0.26 * cos(diskAngle + 2.5));

            // Expanding soft photon-ring absorption pulse when 3D rocket dives in
            float absorbRing = 0.0;
            float absorbGlow = 0.0;
            if (uAbsorbPulse > 0.002) {
              float ap = 1.0 - uAbsorbPulse;
              float waveR = R * (1.02 + ap * 2.55);
              float waveW = R * (0.14 + ap * 0.22);
              absorbRing = exp(-pow((bhDist - waveR) / max(waveW, 0.003), 2.0)) * uAbsorbPulse * smoothstep(R * 0.85, R * 1.05, bhDist);
              absorbGlow = photonRing * uAbsorbPulse * 1.25;
            }

            float chargeBoost = 1.0 + uChargePulse * 0.45;
            vec3 ringCol = mix(uDiskOuter, uDiskInner, 0.72) * (photonRing * 1.35 + photonHalo * 0.72) * doppler * chargeBoost;
            vec3 arcCol  = mix(uDiskOuter, uDiskInner, 0.38) * lensedArcs * 0.68 * chargeBoost;
            vec3 diskCol = mix(uDiskOuter, uDiskInner, smoothstep(R * 2.6, R * 1.08, rDisk) * 0.75) * accretionDisk * 0.94 * chargeBoost;
            vec3 absorbCol = mix(uDiskOuter, vec3(1.0, 0.95, 0.82), 0.55) * (absorbRing * 1.32 + absorbGlow * 0.90);

            vec3 emission = (ringCol + arcCol + diskCol + absorbCol) * edgeMask * uBlackHoleVis;

            // Composite black hole shadow & luminous emission cleanly onto lensed starfield
            float outerDustOcc = clamp((accretionDisk * 0.20 + lensedArcs * 0.10) * edgeMask * uBlackHoleVis, 0.0, 0.28);
            float occAlpha = clamp(max(coreOcclusion, outerDustOcc), 0.0, 1.0);
            vec3 velvetCore = vec3(0.002, 0.003, 0.008);

            col = col * (1.0 - occAlpha) + mix(emission, velvetCore, coreOcclusion * (1.0 - frontHalf * diskRadial * 0.65));
          }
        }

        // Write alpha = 0.0 for cosmic space & black hole so sceneRT.a serves as a pure MSAA 3D rocket coverage mask!
        gl_FragColor = vec4(col, 0.0);
      }
    `;

    // ----------------------------------------------------------------------------
    // 2D. 3D Rocket Dynamic Exhaust Flame Shader (Double-Layered Organic Wobble)
    // ----------------------------------------------------------------------------
    const FLAME_VERT = /* glsl */ `
      uniform float uTime;
      uniform float uFlamePower;
      uniform float uFlameStretch;
      uniform float uPhaseOffset;

      varying float vT;
      varying vec3  vNormalView;
      varying vec3  vViewDir;

      void main() {
        // LatheGeometry uv.y goes from 0.0 at nozzle (y = 0) to 1.0 at teardrop tip

        vec3 pos = position;
        pos.y *= uFlameStretch;

        // Soft organic lateral sway & breathing pulse stronger toward flame tip

        pos.x += sin(uTime * 15.5 + uPhaseOffset + pos.y * 5.2) * wobbleAmt;
        pos.z += cos(uTime * 13.2 + uPhaseOffset * 1.7 + pos.y * 4.6) * wobbleAmt;

        float breathe = 1.0 + sin(uTime * 23.0 + uPhaseOffset - vT * 5.5) * (0.055 + uFlamePower * 0.03) * vT;
        pos.xz *= breathe;

        vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
        vNormalView = normalize(normalMatrix * normal);
        vViewDir = normalize(-mvPos.xyz);

        gl_Position = projectionMatrix * mvPos;
      }
    `;

    const FLAME_FRAG = /* glsl */ `
      precision highp float;

      uniform float uTime;
      uniform float uFlamePower;
      uniform float uPhaseOffset;
      uniform vec3  uColorTop;
      uniform vec3  uColorTip;
      uniform float uOpacityScale;

      varying float vT;
      varying vec3  vNormalView;
      varying vec3  vViewDir;

      void main() {
        // Volumetric soft Fresnel edge attenuation so teardrop flame has plush silhouettes

        float fresnel = pow(clamp(ndotv, 0.0, 1.0), 0.72);

        float tipFade = pow(max(1.0 - vT, 0.0001), 0.75);
        float pulse = 0.88 + 0.12 * sin(uTime * 26.0 + uPhaseOffset - vT * 6.5);

        vec3 col = mix(uColorTop, uColorTip, smoothstep(0.08, 0.92, vT));

      attribute float aAlpha;
      attribute float aType;

      varying float vAlpha;
      varying float vType;
      varying float vRot;
      varying vec3  vColor;

    // 2F. 3D Starlight Return Portal Ring Shader (Stage 5 Arrival)

    const PORTAL_RING_VERT = /* glsl */ `

      void main() {

      uniform float uProgress;
      uniform vec3  uColorA;
      uniform vec3  uColorB;
