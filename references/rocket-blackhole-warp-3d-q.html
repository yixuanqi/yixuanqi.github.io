      // Layer 3: Peripheral Fast Streaks (320 instances, 2.1x outer zip speed)
      const layer3Flyby = createCapsuleStarLayer({
        count: 320,
        zMin: -240,
        zMax: 0,
        layerMode: 2.0,
        swirlRate: 0.0065,
        renderOrder: 20,
        populate(cylPos, meta, flags, weights, count, zSpan) {
          for (let i = 0; i < count; i++) {
            cylPos[i * 3 + 0] = 14.0 + Math.pow(Math.random(), 0.85) * 44.0;
            cylPos[i * 3 + 1] = Math.random() * Math.PI * 2.0;
            cylPos[i * 3 + 2] = Math.random() * zSpan;

            const hasSpike = Math.random() < 0.10 ? 1.0 : 0.0;
            meta[i * 4 + 0] = 0.92 + Math.random() * 0.62;
            meta[i * 4 + 1] = 1.85 + Math.random() * 0.50;
            meta[i * 4 + 2] = 0.88 + Math.random() * 0.82;
            meta[i * 4 + 3] = Math.random();

            flags[i * 4 + 0] = hasSpike;
            flags[i * 4 + 1] = Math.random();
            flags[i * 4 + 2] = 0.62 + Math.random() * 0.40;
            flags[i * 4 + 3] = Math.random();

            writeSpectralWeights(weights, i, [0.40, 0.32, 0.16, 0.12]);
          }
        },
      });

      // --------------------------------------------------------------------------
      // SCENE 2: rocketScene (3D Q-Rocket + 3-Point Lighting + 3D Sparkles + Portal Ring)
      // --------------------------------------------------------------------------
      const rocketScene = new THREE.Scene();

      // Dedicated Soft 3-Point Vinyl-Toy Studio Lighting (soft lavender-cream shadow fill!)
      const hemiLight = new THREE.HemisphereLight(0xDCEBFF, 0x7A668A, 1.15);
      rocketScene.add(hemiLight);

      const keyLight = new THREE.DirectionalLight(0xFFF6EB, 1.55);
      keyLight.position.set(-4.2, 6.0, 5.8);
      rocketScene.add(keyLight);

      const rimLight = new THREE.DirectionalLight(0x78B8FF, 1.25);
      rimLight.position.set(5.2, 2.8, -4.5);
      rocketScene.add(rimLight);

      // Build Procedural 3D Q-Version Chibi Rocket
      const rocket = buildChibiRocket3D(disposables);
      rocketScene.add(rocket.root);

      // 3D Starlight Exhaust Puffs & Sparkles Pool (~160 particles)
      const exhaustPool = new ExhaustParticlePool3D(160, rocketScene, disposables);

      // 3D Glowing Starlight Return Portal Ring (Stage 5 Arrival)
      const portalUniforms = {
        uTime: { value: 0 },
        uProgress: { value: 0 },
        uColorA: { value: liveColors.bhDiskOuter },
        uColorB: { value: liveColors.bhDiskInner },
      };
      const portalGeo = new THREE.PlaneGeometry(2, 2);
      const portalMat = new THREE.ShaderMaterial({
        vertexShader: PORTAL_RING_VERT,
        fragmentShader: PORTAL_RING_FRAG,
        uniforms: portalUniforms,
        transparent: true,
        blending: THREE.CustomBlending,
        blendEquation: THREE.AddEquation,
        blendSrc: THREE.SrcAlphaFactor,
        blendDst: THREE.OneFactor,
        blendEquationAlpha: THREE.AddEquation,
        blendSrcAlpha: THREE.ZeroFactor,
        blendDstAlpha: THREE.OneFactor,
        depthWrite: false,
        side: THREE.DoubleSide,
      });
      const portalMesh = new THREE.Mesh(portalGeo, portalMat);
      portalMesh.visible = false;
      rocketScene.add(portalMesh);
      disposables.push(portalGeo, portalMat);

      // --------------------------------------------------------------------------
      // Post-Processing Graph (Pure Three.js WebGLRenderTargets, Zero External Addons)
      // --------------------------------------------------------------------------
      const postScene = new THREE.Scene();
      const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const postGeo = new THREE.PlaneGeometry(2, 2);

      // Pass 2 Material: Gravitational Lensing Black Hole + Warp Ripples
      const lensingBHUniforms = {
        tSpace: { value: spaceRT.texture },
        uBlackHoleUV: { value: blackHoleUvVec },
        uVanishingUV: { value: vanishingUvVec },
        uAspect: { value: window.innerWidth / Math.max(window.innerHeight, 1) },
        uTime: { value: 0 },
        uBlackHoleScale: { value: 0 },
        uBlackHoleVis: { value: 0 },
        uBlackHoleLens: { value: 0 },
        uChargePulse: { value: 0 },
        uAbsorbPulse: { value: 0 },
        uDiskInner: { value: liveColors.bhDiskInner },
        uDiskOuter: { value: liveColors.bhDiskOuter },
        uRippleScale: { value: params.rippleStrength },
        uRipple1: { value: new THREE.Vector2(0, 0) },
        uRipple2: { value: new THREE.Vector2(0, 0) },
        uAccentColor: { value: liveColors.veilB },
      };
      const lensingBHMat = new THREE.ShaderMaterial({
        vertexShader: FULLSCREEN_VERT,
        fragmentShader: LENSING_BLACKHOLE_FRAG,
        uniforms: lensingBHUniforms,
        depthTest: false,
        depthWrite: false,
      });

      // Pass 4 Material: Bright Extract
      const brightMat = new THREE.ShaderMaterial({
        vertexShader: FULLSCREEN_VERT,
        fragmentShader: BRIGHT_EXTRACT_FRAG,
        uniforms: {
          tDiffuse: { value: sceneRT.texture },
          uThreshold: { value: supportsHalfFloat ? 0.90 : 0.72 },
          uSoftKnee: { value: 0.42 },
        },
        depthTest: false,
        depthWrite: false,
      });

      // Pass 5 Material: Separable Gaussian Blur
      const blurUniforms = {
        tDiffuse: { value: null },
        uDirection: { value: new THREE.Vector2(1, 0) },
        uTexelSize: { value: new THREE.Vector2(1 / bloomHalfA.width, 1 / bloomHalfA.height) },
      };
      const blurMat = new THREE.ShaderMaterial({
        vertexShader: FULLSCREEN_VERT,
        fragmentShader: BLUR_FRAG,
        uniforms: blurUniforms,
        depthTest: false,
        depthWrite: false,
      });

      // Pass 6 Material: Final Composite
      const compositeUniforms = {
        tScene: { value: sceneRT.texture },
        tBloomTight: { value: bloomHalfA.texture },
        tBloomWide: { value: bloomQuarterA.texture },
        uCenter: { value: vanishingUvVec },
        uAspect: { value: window.innerWidth / Math.max(window.innerHeight, 1) },
        uWarp: { value: 0 },
        uFovNorm: { value: 0 },
        uBloomStrength: { value: params.bloomGlow },
        uChromatic: { value: params.chromatic },
        uTime: { value: 0 },
      };
      const compositeMat = new THREE.ShaderMaterial({
        vertexShader: FULLSCREEN_VERT,
        fragmentShader: COMPOSITE_FRAG,
        uniforms: compositeUniforms,
        depthTest: false,
        depthWrite: false,
      });

      // Pass 7 Material: Selective Post-Tonemap FXAA 3.11 (Rocket Silhouette Only)
      // Runs at full strength if hardware MSAA is unavailable, and gentle polish even with 4x MSAA
      const fxaaUniforms = {
        tDiffuse: { value: tonemapRT.texture },
        uTexelSize: { value: new THREE.Vector2(1 / initW, 1 / initH) },
        uFxaaStrength: { value: msaaSamples > 0 ? 0.82 : 1.0 },
        uTime: { value: 0 },
      };
      const fxaaMat = new THREE.ShaderMaterial({
        vertexShader: FULLSCREEN_VERT,
        fragmentShader: FXAA_FRAG,
        uniforms: fxaaUniforms,
        depthTest: false,
        depthWrite: false,
      });

      const postQuad = new THREE.Mesh(postGeo, brightMat);
      postScene.add(postQuad);
      disposables.push(postGeo, lensingBHMat, brightMat, blurMat, compositeMat, fxaaMat);

      // ==========================================================================
      // 7. 5-STAGE ASYMMETRIC CHOREOGRAPHY + MANUAL CANVAS CRUISE
      // ==========================================================================
      const STAGE_DUR = {
        ROCKET_DIVE: 2.15,        // 0.00–0.40s anticipation crouch, 0.40–2.15s 3D Bezier dive
        SINGULARITY_CHARGE: 0.75, // Black hole pulse & FOV 54° -> 45°
        BREAKTHROUGH: 1.25,       // Black hole dissolves + Ripple #1 + FOV 45° -> 110°
        CRUISE: 4.50,             // Serene high-speed passage (extendable by holding Space/canvas)
        ARRIVE_RETURN: 2.85,      // Star convergence + Ripple #2 + final 0.95s 3D portal return
      };
      const TOTAL_SEQ_DUR =
        STAGE_DUR.ROCKET_DIVE +
        STAGE_DUR.SINGULARITY_CHARGE +
        STAGE_DUR.BREAKTHROUGH +
        STAGE_DUR.CRUISE +
        STAGE_DUR.ARRIVE_RETURN;

      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const smoothstep = (e0, e1, x) => {
        const t = clamp01((x - e0) / Math.max(e1 - e0, 0.0001));
        return t * t * (3 - 2 * t);
      };
      const smoothQuint = (x) => {
        const t = clamp01(x);
        return t * t * t * (t * (t * 6 - 15) + 10);
      };
      const easeOutExpo = (x) => {
        const t = clamp01(x);
        return t >= 1 ? 1 : 1 - Math.pow(2, -9 * t);
      };
      const easeInOutCubic = (x) => {
        const t = clamp01(x);
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      };
      const easeOutBack = (x) => {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        const t = clamp01(x) - 1;
        return 1 + c3 * t * t * t + c1 * t * t;
      };

      const ripples = [
        { active: false, progress: 0, strength: 0, speed: 0.72 },
        { active: false, progress: 0, strength: 0, speed: 0.64 },
      ];

      function triggerRipple(slot, strength = 1.0, speed = 0.72) {
        const r = ripples[slot];
        r.active = true;
        r.progress = 0.002;
        r.strength = strength;
        r.speed = speed;
      }

      const state = {
        stage: 'IDLE', // 'IDLE' | 'ROCKET_DIVE' | 'SINGULARITY_CHARGE' | 'BREAKTHROUGH' | 'CRUISE' | 'ARRIVE_RETURN' | 'MANUAL_CRUISE'
        stageTime: 0,
        totalTime: 0,

        // One-shot choreography flags
        firedIgnitionBurst: false,
        firedAbsorbPulse: false,
        firedEntryRipple: false,
        firedExitRipple: false,
        firedReturnPortal: false,
        switchedRealmThisJump: false,
        pendingRealmIndex: 0,

        // Deceleration snapshots
        decelStartWarp: 1,
        decelStartStretch: 1,
        decelStartFov: DEFAULTS.maxFov,
        decelStartVeil: 1,

        // Input tracking
        spaceHeld: false,
        canvasDown: false,
        canvasDownTime: 0,
        canvasDownOnRocket: false,
        rocketHovered: false,
        manualLevel: 0,
        rocketTuck: 0, // Smoothly tucks rocket down out of frame during idle canvas hold-to-cruise

        // Live optical & kinematic state
        warpIntensity: 0,
        chargeIntensity: 0,
        streakNorm: 0,
        veilEnv: 0,
        fov: BASE_FOV,

        // Black hole live parameters
        bhVisibility: 0,
        bhWorldRadius: 0,
        bhLensStrength: 0,
        bhChargePulse: 0,
        bhAbsorbPulse: 0,

        // Continuous multi-layer star travel accumulators
        deepTravel: 0,
        mainTravel: 0,
        flybyTravel: 0,
        veilFlow: 0,
        nebulaDrift: 0,

        // 3D exhaust emission timers
        trailAccum: 0,
        hoverSparkleAccum: 0,

        // Mouse/touch pointer NDC (-1..1) & smoothed parallax
        pointerNdc: new THREE.Vector2(0, 0),
        pointerTarget: new THREE.Vector2(0, 0),
        pointerSmooth: new THREE.Vector2(0, 0),
      };

      // Compute dynamically anchored 3D foreground idle spot (~75% down from top on desktop & mobile)
      function getRocketIdleAnchor() {
        const aspect = camera.aspect;
        const idleZ = -6.2;
        const halfH = Math.abs(idleZ) * Math.tan(THREE.MathUtils.degToRad(BASE_FOV * 0.5));
        const idleY = -0.50 * halfH; // ~75% down from top
        const responsiveScale = THREE.MathUtils.clamp(aspect / 0.80, 0.72, 1.0) * 0.54;
        return { x: 0, y: idleY, z: idleZ, scale: responsiveScale };
      }

      // Reusable vectors/quaternions for zero-GC 3D Bezier flight & particle spawning
      const bzP0 = new THREE.Vector3();
      const bzP1 = new THREE.Vector3();
      const bzP2 = new THREE.Vector3();
      const bzP3 = new THREE.Vector3();
      const flightPos = new THREE.Vector3();
      const flightPrev = new THREE.Vector3();
      const flightNext = new THREE.Vector3();
      const flightTangent = new THREE.Vector3();
      const basisX = new THREE.Vector3();
      const basisZ = new THREE.Vector3();
      const basisMat = new THREE.Matrix4();
      const flightQuat = new THREE.Quaternion();
      const rollQuat = new THREE.Quaternion();
      const localNozzlePos = new THREE.Vector3(0, -0.88, 0);
      const worldNozzlePos = new THREE.Vector3();
      const worldDownDir = new THREE.Vector3();
      const Y_AXIS = new THREE.Vector3(0, 1, 0);
      const REF_FORWARD = new THREE.Vector3(0, 0, 1);

      const COLOR_PUFF_CREAM = new THREE.Color('#FFF4E4');
      const COLOR_PUFF_PEACH = new THREE.Color('#FFD7C4');
      const COLOR_SPARK_GOLD = new THREE.Color('#FFE494');
      const COLOR_SPARK_WHITE = new THREE.Color('#FFFBF0');

      function emitSparkleColor() {
        const pick = Math.random();
        if (pick < 0.36) return COLOR_SPARK_GOLD;
        if (pick < 0.62) return COLOR_SPARK_WHITE;
        return pick < 0.84 ? liveColors.star1 : liveColors.star0;
      }

      function emitIgnitionBurst(origin, scale) {
        // Fluffy creamy-gold cloud puff ring + golden star burst downward
        for (let i = 0; i < 18; i++) {
          const ang = (i / 18) * Math.PI * 2 + Math.random() * 0.25;
          const radSpd = (0.9 + Math.random() * 1.45) * scale;
          exhaustPool.spawn({
            x: origin.x + Math.cos(ang) * 0.10 * scale,
            y: origin.y - 0.04 * scale,
            z: origin.z + Math.sin(ang) * 0.10 * scale,
            vx: Math.cos(ang) * radSpd,
            vy: (-0.6 - Math.random() * 1.1) * scale,
            vz: Math.sin(ang) * radSpd,
            life: 0.65 + Math.random() * 0.42,
            startSize: (0.28 + Math.random() * 0.18) * scale,
            endSize: (0.72 + Math.random() * 0.42) * scale,
            type: 0,
            color: Math.random() < 0.65 ? COLOR_PUFF_CREAM : COLOR_PUFF_PEACH,
          });
        }
        for (let i = 0; i < 20; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = (1.2 + Math.random() * 2.4) * scale;
          exhaustPool.spawn({
            x: origin.x + (Math.random() - 0.5) * 0.18 * scale,
            y: origin.y,
            z: origin.z + (Math.random() - 0.5) * 0.18 * scale,
            vx: Math.cos(ang) * spd,
            vy: (-0.8 - Math.random() * 1.6) * scale,
            vz: Math.sin(ang) * spd,
            life: 0.58 + Math.random() * 0.48,
            startSize: (0.22 + Math.random() * 0.24) * scale,
            endSize: (0.08 + Math.random() * 0.10) * scale,
            type: 1,
            color: emitSparkleColor(),
          });
        }
      }

      function emitSparkleBurst3D(origin, count, speedScale, sizeScale) {
        for (let i = 0; i < count; i++) {
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          const spd = (1.1 + Math.random() * 2.3) * speedScale;
          exhaustPool.spawn({
            x: origin.x,
            y: origin.y,
            z: origin.z,
            vx: Math.sin(phi) * Math.cos(theta) * spd,
            vy: Math.sin(phi) * Math.sin(theta) * spd,
            vz: Math.cos(phi) * spd * 0.5,
            life: 0.55 + Math.random() * 0.52,
            startSize: (0.26 + Math.random() * 0.28) * sizeScale,
            endSize: 0.08 * sizeScale,
            type: 1,
            color: emitSparkleColor(),
          });
        }
      }

      // ==========================================================================
      // 8. HUD ELEMENTS, RAYCASTER & INTERACTION BINDINGS
      // ==========================================================================
      const raycaster = new THREE.Raycaster();
      const elTopLeftStatus = document.getElementById('top-left-status');
      const elPhaseDot = document.getElementById('phase-dot');
      const elPhaseIndicator = document.getElementById('phase-indicator');
      const elRealmBadgeInner = document.getElementById('realm-badge-inner');
      const elRealmZh = document.getElementById('realm-name-zh');
      const elRealmEn = document.getElementById('realm-name-en');
      const elRocketCaption = document.getElementById('rocket-caption');
      const elProgressWrap = document.getElementById('warp-progress-wrap');
      const elProgressBar = document.getElementById('warp-progress-bar');

      const elHideUiBtn = document.getElementById('hide-ui-btn');
      const elRestoreUiBtn = document.getElementById('restore-ui-btn');
      const elToggleParamsBtn = document.getElementById('toggle-params-btn');
      const elParamsDrawer = document.getElementById('params-drawer');
      const elResetBtn = document.getElementById('reset-params-btn');
      const elAutoRealmBtn = document.getElementById('auto-realm-toggle');
      const elAutoRealmTrack = document.getElementById('auto-realm-track');
      const realmChips = document.querySelectorAll('.realm-chip');

      let badgeTimer = null;

      function applyRealmUI(index, animateBadge = true) {
        const r = REALMS[index];
        if (!r) return;

        document.documentElement.style.setProperty('--accent', r.cssAccent);
        document.documentElement.style.setProperty('--accent-soft', r.cssSoft);
        document.documentElement.style.setProperty('--accent-faint', r.cssFaint);

        elPhaseDot.style.backgroundColor = r.cssAccent;
        elPhaseDot.style.boxShadow = `0 0 8px ${r.cssAccent}`;

        realmChips.forEach((chip) => {
          chip.classList.toggle('active', Number(chip.dataset.realm) === index);
        });

        if (animateBadge) {
          elRealmBadgeInner.classList.add('is-switching');
          clearTimeout(badgeTimer);
          badgeTimer = setTimeout(() => {
            elRealmZh.textContent = r.zh;
            elRealmEn.textContent = r.en;
            elRealmBadgeInner.classList.remove('is-switching');
          }, 280);
        } else {
          elRealmZh.textContent = r.zh;
          elRealmEn.textContent = r.en;
        }
      }

      function selectRealm(index, immediateBadge = true) {
        params.realmIndex = ((index % REALMS.length) + REALMS.length) % REALMS.length;
        if (immediateBadge) {
          applyRealmUI(params.realmIndex, true);
        } else {
          realmChips.forEach((chip) => {
            chip.classList.toggle('active', Number(chip.dataset.realm) === params.realmIndex);
          });
        }
      }

      function launchRocketSequence() {
        if (state.stage !== 'IDLE') return;
        state.stage = 'ROCKET_DIVE';
        state.stageTime = 0;
        state.totalTime = 0;
        state.firedIgnitionBurst = false;
        state.firedAbsorbPulse = false;
        state.firedEntryRipple = false;
        state.firedExitRipple = false;
        state.firedReturnPortal = false;
        state.switchedRealmThisJump = false;
        state.pendingRealmIndex = (params.realmIndex + 1) % REALMS.length;
        state.rocketHovered = false;
        canvas.classList.remove('rocket-hover');
        elRocketCaption.classList.remove('is-illuminated');
        elRocketCaption.classList.add('is-hidden');
      }

      function enterArrival() {
        if (state.stage !== 'CRUISE') return;
        if (params.autoSwitchRealm && !state.switchedRealmThisJump) {
          state.switchedRealmThisJump = true;
          selectRealm(state.pendingRealmIndex, false);
        }
        state.stage = 'ARRIVE_RETURN';
        state.stageTime = 0;
        state.firedExitRipple = false;
        state.firedReturnPortal = false;
        state.decelStartWarp = Math.max(state.warpIntensity, 0.35);
        state.decelStartStretch = Math.max(state.streakNorm, 0.35);
        state.decelStartFov = state.fov;
        state.decelStartVeil = state.veilEnv;
      }

      function checkRocketHit(ndcVec) {
        if (state.stage !== 'IDLE' || state.rocketTuck > 0.25) return false;
        raycaster.setFromCamera(ndcVec, camera);
        const hits = raycaster.intersectObject(rocket.hitMesh, false);
        return hits.length > 0;
      }

      // UI Controls Listeners
      function toggleUi() {
        document.body.classList.toggle('ui-hidden');
      }
      elHideUiBtn.addEventListener('click', toggleUi);
      elRestoreUiBtn.addEventListener('click', toggleUi);

      elToggleParamsBtn.addEventListener('click', () => {
        const collapsed = elParamsDrawer.classList.toggle('is-collapsed');
        elToggleParamsBtn.setAttribute('aria-expanded', String(!collapsed));
      });

      realmChips.forEach((chip) => {
        chip.addEventListener('click', () => selectRealm(Number(chip.dataset.realm), true));
      });

      elAutoRealmBtn.addEventListener('click', () => {
        params.autoSwitchRealm = !params.autoSwitchRealm;
        elAutoRealmBtn.setAttribute('aria-checked', String(params.autoSwitchRealm));
        elAutoRealmTrack.dataset.on = String(params.autoSwitchRealm);
      });

      const sliderBindings = [
        { key: 'streakLength', id: 'slider-streak', valId: 'val-streak', fmt: (v) => v.toFixed(2) },
        { key: 'bgStarSpeed', id: 'slider-bgflow', valId: 'val-bgflow', fmt: (v) => `${v.toFixed(2)}x` },
        { key: 'streamDensity', id: 'slider-density', valId: 'val-density', fmt: (v) => v.toFixed(2) },
        { key: 'maxFov', id: 'slider-maxfov', valId: 'val-maxfov', fmt: (v) => `${Math.round(v)}°` },
        { key: 'bloomGlow', id: 'slider-bloom', valId: 'val-bloom', fmt: (v) => v.toFixed(2) },
        { key: 'spacetimeVeil', id: 'slider-veil', valId: 'val-veil', fmt: (v) => v.toFixed(2) },
        { key: 'rippleStrength', id: 'slider-ripple', valId: 'val-ripple', fmt: (v) => v.toFixed(2) },
        { key: 'chromatic', id: 'slider-chromatic', valId: 'val-chromatic', fmt: (v) => v.toFixed(2) },
      ];

      sliderBindings.forEach((item) => {
        const slider = document.getElementById(item.id);
        const readout = document.getElementById(item.valId);
        slider.addEventListener('input', () => {
          const val = parseFloat(slider.value);
          params[item.key] = val;
          readout.textContent = item.fmt(val);
        });
      });

      elResetBtn.addEventListener('click', () => {
        Object.assign(params, DEFAULTS);
        applyRealmUI(params.realmIndex, true);
        elAutoRealmBtn.setAttribute('aria-checked', 'true');
        elAutoRealmTrack.dataset.on = 'true';
        sliderBindings.forEach((item) => {
          const slider = document.getElementById(item.id);
          const readout = document.getElementById(item.valId);
          slider.value = String(params[item.key]);
          readout.textContent = item.fmt(params[item.key]);
        });
      });

      // Pointer & Keyboard Interactions (Raycasting 3D Rocket + Hold Empty Canvas for Manual Cruise)
      function updatePointerCoords(clientX, clientY) {
        const nx = (clientX / Math.max(window.innerWidth, 1)) * 2 - 1;
        const ny = -(clientY / Math.max(window.innerHeight, 1)) * 2 + 1;
        state.pointerNdc.set(THREE.MathUtils.clamp(nx, -1, 1), THREE.MathUtils.clamp(ny, -1, 1));
        state.pointerTarget.copy(state.pointerNdc);
      }

      const onPointerMove = (e) => {
        updatePointerCoords(e.clientX, e.clientY);
        const hit = checkRocketHit(state.pointerNdc);
        state.rocketHovered = hit;
        canvas.classList.toggle('rocket-hover', hit);
        elRocketCaption.classList.toggle('is-illuminated', hit);
      };
      window.addEventListener('pointermove', onPointerMove, { passive: true });

      canvas.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        updatePointerCoords(e.clientX, e.clientY);
        const hit = checkRocketHit(state.pointerNdc);
        state.canvasDown = true;
        state.canvasDownTime = performance.now();
        state.canvasDownOnRocket = hit;

        if (hit && state.stage === 'IDLE') {
          launchRocketSequence();
        }
      });

      const onPointerRelease = () => {
        state.canvasDown = false;
        state.canvasDownOnRocket = false;
      };
      window.addEventListener('pointerup', onPointerRelease);
      window.addEventListener('pointercancel', onPointerRelease);

      const onBlur = () => {
        state.canvasDown = false;
        state.spaceHeld = false;
        state.rocketHovered = false;
        canvas.classList.remove('rocket-hover');
      };
      window.addEventListener('blur', onBlur);

      const onKeyDown = (e) => {
        if (document.activeElement?.tagName === 'INPUT') return;
        if (e.code === 'Space') {
          e.preventDefault();
          state.spaceHeld = true;
          if (state.stage === 'IDLE') {
            launchRocketSequence();
          }
        } else if (e.key === 'h' || e.key === 'H') {
          e.preventDefault();
          toggleUi();
        }
      };

      const onKeyUp = (e) => {
        if (e.code === 'Space') {
          state.spaceHeld = false;
        }
      };

      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', onKeyUp);

      // ==========================================================================
      // 9. RESPONSIVE HiDPI RESIZE & CLEAN DISPOSAL
      // ==========================================================================
      function onResize() {
        const w = window.innerWidth;
        const h = Math.max(window.innerHeight, 1);
        const dpr = getDPR();
        const aspect = w / h;

        camera.aspect = aspect;
        camera.updateProjectionMatrix();

        renderer.setPixelRatio(dpr);
        renderer.setSize(w, h, false);

        const rw = Math.max(1, Math.floor(w * dpr));
        const rh = Math.max(1, Math.floor(h * dpr));
        const hw = Math.max(1, Math.floor(rw * 0.5));
        const hh = Math.max(1, Math.floor(rh * 0.5));
        const qw = Math.max(1, Math.floor(rw * 0.25));
        const qh = Math.max(1, Math.floor(rh * 0.25));

        spaceRT.setSize(rw, rh);
        sceneRT.setSize(rw, rh);
        tonemapRT.setSize(rw, rh);
        brightRT.setSize(hw, hh);
        bloomHalfA.setSize(hw, hh);
        bloomHalfB.setSize(hw, hh);
        bloomQuarterA.setSize(qw, qh);
        bloomQuarterB.setSize(qw, qh);

        resolutionVec.set(rw, rh);
        fxaaUniforms.uTexelSize.value.set(1 / rw, 1 / rh);

        backdropUniforms.uAspect.value = aspect;
        lensingBHUniforms.uAspect.value = aspect;
        compositeUniforms.uAspect.value = aspect;

        [layer1Deep, layer2Main, layer3Flyby].forEach(({ uniforms }) => {
          uniforms.uAspect.value = aspect;
          uniforms.uPixelRatio.value = dpr;
        });
      }

      window.addEventListener('resize', onResize);

      let rafId = 0;
      const cleanup = () => {
        cancelAnimationFrame(rafId);
        window.removeEventListener('resize', onResize);
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerRelease);
        window.removeEventListener('pointercancel', onPointerRelease);
        window.removeEventListener('blur', onBlur);
        window.removeEventListener('keydown', onKeyDown);
        window.removeEventListener('keyup', onKeyUp);
        disposables.forEach((d) => d.dispose && d.dispose());
        renderer.dispose();
      };
      window.addEventListener('beforeunload', cleanup);

      // ==========================================================================
      // 10. MAIN 60FPS ANIMATION & 6-PASS RENDER LOOP
      // ==========================================================================
      const camRight = new THREE.Vector3();
      const camUp = new THREE.Vector3();
      const camForward = new THREE.Vector3();
      const vanishingWorld = new THREE.Vector3(0, 0, -1200);
      const vanishingNDC = new THREE.Vector3();
      const bhNDC = new THREE.Vector3();
      const bhViewPos = new THREE.Vector3();

      let lastNow = performance.now();
      let elapsed = 0;

      function updatePhaseHUD(phaseText, showProgress, progressPct) {
        if (elPhaseIndicator.textContent !== phaseText) {
          elPhaseIndicator.textContent = phaseText;
        }
        elTopLeftStatus.classList.toggle('is-dimmed', showProgress);
        elProgressWrap.classList.toggle('is-visible', showProgress);
        elProgressBar.style.width = `${clamp01(progressPct / 100) * 100}%`;
      }

      function animate(now) {
        rafId = requestAnimationFrame(animate);

        const dt = Math.min((now - lastNow) * 0.001, 0.05);
        lastNow = now;
        elapsed += dt;

        // 1) Smooth Active Starfield Theme Cross-Fade Across Cosmos, Black Hole & Rim Light
        const activeRealm = REALMS[params.realmIndex];
        const colorRate = 1.0 - Math.exp(-dt * 1.45);
        liveColors.rimLight.lerp(activeRealm.rimLight, colorRate);
        liveColors.skyDeep.lerp(activeRealm.skyDeep, colorRate);
        liveColors.skyMid.lerp(activeRealm.skyMid, colorRate);
        liveColors.nebulaA.lerp(activeRealm.nebulaA, colorRate);
        liveColors.nebulaB.lerp(activeRealm.nebulaB, colorRate);
        liveColors.veilA.lerp(activeRealm.veilA, colorRate);
        liveColors.veilB.lerp(activeRealm.veilB, colorRate);
        liveColors.vpGlow.lerp(activeRealm.vpGlow, colorRate);
        liveColors.bhDiskInner.lerp(activeRealm.bhDiskInner, colorRate);
        liveColors.bhDiskOuter.lerp(activeRealm.bhDiskOuter, colorRate);
        liveColors.star0.lerp(activeRealm.star0, colorRate);
        liveColors.star1.lerp(activeRealm.star1, colorRate);
        liveColors.star2.lerp(activeRealm.star2, colorRate);
        liveColors.star3.lerp(activeRealm.star3, colorRate);
        liveColors.headTint.lerp(activeRealm.headTint, colorRate);
        rimLight.color.copy(liveColors.rimLight);

        // Animate tiny glowing golden star inside rocket cabin
        rocket.cabinStarMesh.rotation.z = Math.sin(elapsed * 2.1) * 0.25;
        rocket.cabinStarMesh.position.y = Math.sin(elapsed * 3.0) * 0.012;

        // 2) Step Complete 5-Stage Choreography + Idle Hold-to-Cruise
        const anchor = getRocketIdleAnchor();
        const isExtendingCruise = state.spaceHeld || state.canvasDown;

        // Check empty-canvas hold > 220ms when idle -> smoothly enter MANUAL_CRUISE
        if (state.stage === 'IDLE' && state.canvasDown && !state.canvasDownOnRocket) {
          if (now - state.canvasDownTime > 220) {
            state.stage = 'MANUAL_CRUISE';
            elRocketCaption.classList.add('is-hidden');
          }
        }

        let targetWarp = 0;
        let targetCharge = 0;
        let targetStretch = 0;
        let targetVeil = 0;
        let targetFov = BASE_FOV;
        let mainSpeed = 2.6;

        let targetBhVis = 0;
        let targetBhWorldRadius = 0;
        let targetBhLens = 0;
        let targetBhCharge = 0;

        let flamePower = 0.20;
        let flameStretch = 0.72;
        let phaseText = '静谧星海';
        let progressPct = 0;
        let showProgress = false;
        let centerParallax = false;

        portalMesh.visible = false;

        if (state.stage === 'IDLE') {
          state.rocketTuck += (0.0 - state.rocketTuck) * (1.0 - Math.exp(-dt * 5.5));
          elRocketCaption.classList.toggle('is-hidden', state.rocketTuck > 0.25);

          rocket.root.visible = true;
          const bob = Math.sin(elapsed * 2.3) * 0.08;
          const hoverLift = state.rocketHovered ? 0.14 : 0.0;
          const tuckDrop = state.rocketTuck * 2.2;

          rocket.root.position.set(anchor.x, anchor.y + bob + hoverLift - tuckDrop, anchor.z);

          // Playful hover wiggle + gentle turn toward mouse pointer for tactile vinyl-toy charm!
          const hoverWiggle = state.rocketHovered ? Math.sin(elapsed * 9.5) * 0.14 : 0.0;
          const idleSway = Math.sin(elapsed * 1.2) * 0.06;
          rocket.root.rotation.order = 'YXZ';
          rocket.root.rotation.y = state.pointerSmooth.x * 0.34 + Math.sin(elapsed * 0.85) * 0.14;
          rocket.root.rotation.x = -state.pointerSmooth.y * 0.16 + 0.05;
          rocket.root.rotation.z = idleSway + hoverWiggle - state.pointerSmooth.x * 0.08;

          const hoverScale = (state.rocketHovered ? 1.07 : 1.0) * (1.0 - state.rocketTuck * 0.35);
          const s = anchor.scale * hoverScale;
          rocket.root.scale.set(s, s, s);

          flamePower = state.rocketHovered ? 0.65 : 0.22;
          flameStretch = state.rocketHovered ? 0.98 : 0.72;

          // Emit cute subtle sparkles on hover
          if (state.rocketHovered && state.rocketTuck < 0.1) {
            state.hoverSparkleAccum += dt;
            if (state.hoverSparkleAccum >= 0.11) {
              state.hoverSparkleAccum = 0;
              rocket.root.updateMatrixWorld();
              worldNozzlePos.copy(localNozzlePos).applyMatrix4(rocket.root.matrixWorld);
              exhaustPool.spawn({
                x: worldNozzlePos.x + (Math.random() - 0.5) * 0.22,
                y: worldNozzlePos.y - 0.06,
                z: worldNozzlePos.z + (Math.random() - 0.5) * 0.16,
                vx: (Math.random() - 0.5) * 0.55,
                vy: -0.75 - Math.random() * 0.65,
                vz: (Math.random() - 0.5) * 0.35,
                life: 0.58 + Math.random() * 0.36,
                startSize: 0.16 + Math.random() * 0.14,
                endSize: 0.05,
                type: 1,
                color: emitSparkleColor(),
              });
            }
          }
        } else if (state.stage === 'MANUAL_CRUISE') {
          // Smooth manual hold-to-cruise on empty canvas: rocket tucks down gracefully out of frame
          const holding = state.canvasDown || state.spaceHeld;
          state.manualLevel += ((holding ? 1.0 : 0.0) - state.manualLevel) * (1.0 - Math.exp(-dt * (holding ? 2.4 : 2.2)));
          state.rocketTuck += (1.0 - state.rocketTuck) * (1.0 - Math.exp(-dt * 5.0));

          const tuckDrop = state.rocketTuck * 2.4;
          rocket.root.visible = state.rocketTuck < 0.96;
          rocket.root.position.set(anchor.x, anchor.y - tuckDrop, anchor.z);
          const s = anchor.scale * Math.max(0.01, 1.0 - state.rocketTuck * 0.55);
          rocket.root.scale.set(s, s, s);

          const m = smoothQuint(state.manualLevel);
          targetWarp = m;
          targetStretch = m;
          targetVeil = m;
          targetFov = BASE_FOV + (params.maxFov - BASE_FOV) * m;
          mainSpeed = 2.6 + Math.pow(m, 1.4) * 168.0;

          phaseText = holding ? '星海巡航 · 手动' : '减速归位';
          showProgress = true;
          progressPct = m * 100;

          if (!holding && state.manualLevel < 0.02) {
            state.stage = 'IDLE';
            state.manualLevel = 0;
          }
        } else if (state.stage === 'ROCKET_DIVE') {
          // STAGE 1: Ignition & 3D Spiral Dive (2.35s)
          state.stageTime += dt;
          state.totalTime += dt;
          showProgress = true;
          phaseText = '点火跃入黑洞';
          progressPct = (state.totalTime / TOTAL_SEQ_DUR) * 100;

          const t = state.stageTime;
          const bhBloom = smoothQuint(clamp01(t / 1.25));
          targetBhVis = bhBloom;
          targetBhWorldRadius = 1.38 * (0.32 + 0.68 * bhBloom);
          targetBhLens = 0.88 * bhBloom;
          mainSpeed = THREE.MathUtils.lerp(2.6, 0.85, bhBloom);

          rocket.root.visible = true;
          const T_CROUCH = 0.40;
          const T_END = STAGE_DUR.ROCKET_DIVE;

          if (t < T_CROUCH) {
            // 0.00–0.45s: Cute squash-and-stretch anticipation crouch + excited wiggle + puff burst
            const p = t / T_CROUCH;
            const crouch = Math.sin(p * Math.PI);
            const sxz = anchor.scale * (1.0 + crouch * 0.14);
            const sy = anchor.scale * (1.0 - crouch * 0.20);

            rocket.root.position.set(anchor.x, anchor.y - crouch * 0.14, anchor.z);
            rocket.root.rotation.set(0.06, Math.sin(p * Math.PI * 3) * 0.10, Math.sin(p * Math.PI * 5) * 0.08);
            rocket.root.scale.set(sxz, sy, sxz);

            flamePower = 0.45 + p * 1.15;
            flameStretch = 0.90 + p * 0.65;

            if (!state.firedIgnitionBurst && t >= 0.16) {
              state.firedIgnitionBurst = true;
              rocket.root.updateMatrixWorld();
              worldNozzlePos.copy(localNozzlePos).applyMatrix4(rocket.root.matrixWorld);
              emitIgnitionBurst(worldNozzlePos, anchor.scale * 1.45);
            }
          } else {
            // 0.45–2.35s: Smooth 3D Cubic Bezier sweeping arc into exact BH_ANCHOR (0, 0.25, -14.5)
            const uRaw = clamp01((t - T_CROUCH) / (T_END - T_CROUCH));
            // Smooth acceleration into gravitational capture
            const u = uRaw * uRaw * (1.35 - 0.35 * uRaw);
            const arcScale = Math.min(1.0, camera.aspect * 0.88);

            bzP0.set(anchor.x, anchor.y, anchor.z);
            bzP1.set(2.35 * arcScale, anchor.y + 2.65, -7.2);
            bzP2.set(2.75 * arcScale, 2.35, -11.6);
            bzP3.copy(BH_ANCHOR);

            evalCubicBezier3D(bzP0, bzP1, bzP2, bzP3, clamp01(u), flightPos);
            evalCubicBezier3D(bzP0, bzP1, bzP2, bzP3, clamp01(u - 0.012), flightPrev);
            evalCubicBezier3D(bzP0, bzP1, bzP2, bzP3, clamp01(u + 0.012), flightNext);

            flightTangent.subVectors(flightNext, flightPrev).normalize();

            // Build smooth orthonormal orientation basis aligning +Y nose cleanly to 3D tangent
            basisX.crossVectors(flightTangent, REF_FORWARD);
            if (basisX.lengthSq() < 0.001) basisX.set(1, 0, 0);
            basisX.normalize();
            basisZ.crossVectors(basisX, flightTangent).normalize();
            basisMat.makeBasis(basisX, flightTangent, basisZ);
            flightQuat.setFromRotationMatrix(basisMat);

            // Charming gentle axial barrel roll around flight axis as it dives into the black hole
            const barrelRoll = smoothQuint(uRaw) * Math.PI * 2.25;
            rollQuat.setFromAxisAngle(Y_AXIS, barrelRoll);
            rocket.root.quaternion.copy(flightQuat).multiply(rollQuat);
            rocket.root.position.copy(flightPos);

            // Initial rebound stretch settling smoothly, then final 0.5s gravitational spaghettification
            const spagStart = (T_END - 0.50 - T_CROUCH) / (T_END - T_CROUCH);
            let sXZ = anchor.scale;
            let sY = anchor.scale;

            if (uRaw < 0.22) {
              const reb = 1.0 - uRaw / 0.22;
              sXZ = anchor.scale * (1.0 - reb * 0.12);
              sY = anchor.scale * (1.0 + reb * 0.18);
            } else if (uRaw > spagStart) {
              const sv = clamp01((uRaw - spagStart) / (1.0 - spagStart));
              const shrink = THREE.MathUtils.lerp(1.0, 0.0, Math.pow(sv, 1.55));
              const pull = Math.sin(sv * Math.PI);
              sXZ = anchor.scale * shrink * (1.0 - pull * 0.24);
              sY = anchor.scale * shrink * (1.0 + pull * 0.48);

              // Trigger photon-ring absorption pulse right as rocket slips into velvet horizon
              if (!state.firedAbsorbPulse && sv >= 0.86) {
                state.firedAbsorbPulse = true;
                state.bhAbsorbPulse = 1.0;
                emitSparkleBurst3D(BH_ANCHOR, 26, 1.45, 1.25);
              }
            }

            rocket.root.scale.set(Math.max(0.0001, sXZ), Math.max(0.0001, sY), Math.max(0.0001, sXZ));
            if (sY < 0.004) rocket.root.visible = false;

            flamePower = 1.45;
            flameStretch = 1.55 + Math.sin(elapsed * 22) * 0.12;

            // Emit continuous 3D curving stardust & fluffy mini-puff trail behind nozzle
            state.trailAccum += dt;
            if (state.trailAccum >= 0.018 && rocket.root.visible && sY > 0.08) {
              state.trailAccum = 0;
              rocket.root.updateMatrixWorld();
              worldNozzlePos.copy(localNozzlePos).applyMatrix4(rocket.root.matrixWorld);
              worldDownDir.set(0, -1, 0).applyQuaternion(rocket.root.quaternion).normalize();
              const trailScale = sY / anchor.scale;

              // Pastel exhaust mini-puff
              exhaustPool.spawn({
                x: worldNozzlePos.x + (Math.random() - 0.5) * 0.08,
                y: worldNozzlePos.y + (Math.random() - 0.5) * 0.08,
                z: worldNozzlePos.z + (Math.random() - 0.5) * 0.08,
                vx: worldDownDir.x * (0.9 + Math.random() * 0.8) + (Math.random() - 0.5) * 0.3,
                vy: worldDownDir.y * (0.9 + Math.random() * 0.8) + (Math.random() - 0.5) * 0.3,
                vz: worldDownDir.z * (0.9 + Math.random() * 0.8) + (Math.random() - 0.5) * 0.3,
                life: 0.45 + Math.random() * 0.30,
                startSize: (0.20 + Math.random() * 0.14) * trailScale,
                endSize: (0.48 + Math.random() * 0.24) * trailScale,
                type: 0,
                color: Math.random() < 0.65 ? COLOR_PUFF_CREAM : COLOR_PUFF_PEACH,
              });

              // Twinkling 3D gold/ice-blue stardust sparkle
              exhaustPool.spawn({
                x: worldNozzlePos.x + (Math.random() - 0.5) * 0.16,
                y: worldNozzlePos.y + (Math.random() - 0.5) * 0.16,
                z: worldNozzlePos.z + (Math.random() - 0.5) * 0.16,
                vx: worldDownDir.x * (1.2 + Math.random() * 1.1) + (Math.random() - 0.5) * 0.65,
                vy: worldDownDir.y * (1.2 + Math.random() * 1.1) + (Math.random() - 0.5) * 0.65,
                vz: worldDownDir.z * (1.2 + Math.random() * 1.1) + (Math.random() - 0.5) * 0.65,
                life: 0.55 + Math.random() * 0.45,
                startSize: (0.20 + Math.random() * 0.20) * Math.max(0.35, trailScale),
                endSize: 0.06,
                type: 1,
                color: emitSparkleColor(),
              });
            }
          }

          if (state.stageTime >= STAGE_DUR.ROCKET_DIVE) {
            rocket.root.visible = false;
            state.stage = 'SINGULARITY_CHARGE';
            state.stageTime = 0;
          }
        } else if (state.stage === 'SINGULARITY_CHARGE') {
          // STAGE 2: Singularity Compression (0.75s)
          state.stageTime += dt;
          state.totalTime += dt;
          showProgress = true;
          centerParallax = true;
          rocket.root.visible = false;

          const p = clamp01(state.stageTime / STAGE_DUR.SINGULARITY_CHARGE);
          const e = smoothQuint(p);

          phaseText = '奇点收束';
          progressPct = (state.totalTime / TOTAL_SEQ_DUR) * 100;

          targetBhVis = 1.0;
          targetBhWorldRadius = 1.38 * (1.0 - 0.24 * e + Math.sin(p * Math.PI * 2.0) * 0.045);
          targetBhLens = 0.88 + 0.52 * e;
          targetBhCharge = e;

          targetCharge = e;
          targetStretch = Math.pow(p, 3.0) * 0.04;
          targetFov = BASE_FOV - (BASE_FOV - CHARGE_FOV) * e;
          mainSpeed = THREE.MathUtils.lerp(0.85, 0.25, e);

          if (state.stageTime >= STAGE_DUR.SINGULARITY_CHARGE) {
            state.stage = 'BREAKTHROUGH';
            state.stageTime = 0;
          }
        } else if (state.stage === 'BREAKTHROUGH') {
          // STAGE 3: Spacetime Breakthrough (1.25s)
          state.stageTime += dt;
          state.totalTime += dt;
          showProgress = true;
          rocket.root.visible = false;

          const p = clamp01(state.stageTime / STAGE_DUR.BREAKTHROUGH);
          phaseText = '时空破壁';
          progressPct = (state.totalTime / TOTAL_SEQ_DUR) * 100;

          if (!state.firedEntryRipple && state.stageTime >= 0.03) {
            state.firedEntryRipple = true;
            triggerRipple(0, 1.05, 0.72);
          }

          const bhDissolve = 1.0 - smoothQuint(clamp01(p / 0.62));
          targetBhVis = bhDissolve;
          targetBhWorldRadius = 1.15 + easeOutExpo(p) * 5.2;
          targetBhLens = bhDissolve * 0.95;
          targetBhCharge = bhDissolve * 0.60;

          const ignite = easeOutExpo(p);
          const fovSweep = easeInOutCubic(p);

          targetCharge = Math.max(0, 1.0 - p * 4.0);
          targetWarp = ignite;
          targetStretch = Math.pow(ignite, 0.90);
          targetVeil = smoothQuint(clamp01((p - 0.14) / 0.86));
          targetFov = CHARGE_FOV + (params.maxFov - CHARGE_FOV) * fovSweep;
          mainSpeed = 0.6 + Math.pow(ignite, 1.32) * 172.0;

          if (state.stageTime >= STAGE_DUR.BREAKTHROUGH) {
            state.stage = 'CRUISE';
            state.stageTime = 0;
          }
        } else if (state.stage === 'CRUISE') {
          // STAGE 4: Serene Hyper-Cruise (4.6s, extendable by holding Spacebar or Canvas)
          state.stageTime += dt;
          if (!isExtendingCruise || state.stageTime < STAGE_DUR.CRUISE) {
            state.totalTime += dt;
          }
          showProgress = true;
          rocket.root.visible = false;

          phaseText = isExtendingCruise ? '星海巡航 · 延长中' : '星海巡航';
          progressPct = Math.min(76, (state.totalTime / TOTAL_SEQ_DUR) * 100);

          targetWarp = 1.0;
          targetStretch = 1.0;
          targetVeil = 1.0;
          targetFov = params.maxFov;
          mainSpeed = 172.5;

          // Midway through cruise, smoothly cross-fade starfield theme to next cosmic region
          if (params.autoSwitchRealm && !state.switchedRealmThisJump && state.stageTime >= STAGE_DUR.CRUISE * 0.44) {
            state.switchedRealmThisJump = true;
            selectRealm(state.pendingRealmIndex, false);
          }

          if (state.stageTime >= STAGE_DUR.CRUISE && !isExtendingCruise) {
            enterArrival();
          }
        } else if (state.stage === 'ARRIVE_RETURN') {
          // STAGE 5: Arrival & 3D Rocket Portal Return (2.90s)
          state.stageTime += dt;
          state.totalTime += dt;
          showProgress = true;

          const p = clamp01(state.stageTime / STAGE_DUR.ARRIVE_RETURN);
          phaseText = '抵达新星域';
          progressPct = clamp01(76 + p * 24);

          if (!state.firedExitRipple && state.stageTime >= 0.08) {
            state.firedExitRipple = true;
            triggerRipple(1, 0.78, 0.64);
          }

          // Decoupled head deceleration vs tail collapse -> pinprick stars with cross spikes
          const headDecel = Math.pow(1.0 - p, 3.15);
          const tailRetract = 1.0 - smoothQuint(clamp01(p / 0.82));

          targetWarp = state.decelStartWarp * Math.pow(1.0 - p, 2.05);
          targetStretch = state.decelStartStretch * tailRetract;
          targetVeil = state.decelStartVeil * (1.0 - smoothQuint(clamp01(p / 0.56)));

          // Gentle damped elastic FOV settle back to 54°
          const elastic = Math.exp(-p * 4.35) * Math.cos(p * Math.PI * 1.15);
          targetFov = BASE_FOV + (state.decelStartFov - BASE_FOV) * elastic;
          mainSpeed = 2.6 + (169.5 * state.decelStartWarp) * headDecel;

          // Final 0.95s: 3D glowing starlight portal ring blooms at idle spot & rocket pops back out!
          const returnStart = STAGE_DUR.ARRIVE_RETURN - 0.95;
          if (state.stageTime >= returnStart) {
            const rp = clamp01((state.stageTime - returnStart) / 0.95);

            if (!state.firedReturnPortal) {
              state.firedReturnPortal = true;
              emitSparkleBurst3D(new THREE.Vector3(anchor.x, anchor.y, anchor.z), 22, 0.95, 0.95);
              if (state.switchedRealmThisJump) {
                applyRealmUI(params.realmIndex, true);
              }
            }

            // Delicate 3D starlight portal ring tilted slightly toward viewer
            portalMesh.visible = true;
            portalMesh.position.set(anchor.x, anchor.y - 0.05, anchor.z - 0.05);
            portalMesh.rotation.set(0.32, 0, elapsed * 0.9);
            const pScale = anchor.scale * 2.45;
            portalMesh.scale.set(pScale, pScale, 1);
            portalUniforms.uTime.value = elapsed;
            portalUniforms.uProgress.value = rp;

            // Elastic spring pop-in (`easeOutBack`) + cheerful 360° Y-spin
            const rocketRp = clamp01((rp - 0.08) / 0.92);
            const spring = Math.max(0.001, easeOutBack(rocketRp));
            const s = anchor.scale * spring;
            rocket.root.visible = rocketRp > 0.001;
            rocket.root.position.set(anchor.x, anchor.y + Math.sin(rocketRp * Math.PI) * 0.16, anchor.z);
            rocket.root.rotation.order = 'YXZ';
            rocket.root.rotation.set(0.05, (1.0 - smoothQuint(rocketRp)) * Math.PI * 2.0, Math.sin(rocketRp * Math.PI * 2) * 0.08 * (1 - rocketRp));
            rocket.root.scale.set(s, s, s);

            flamePower = 0.25 + (1.0 - rocketRp) * 0.45;
            flameStretch = 0.72 + (1.0 - rocketRp) * 0.35;
          } else {
            rocket.root.visible = false;
          }

          if (state.stageTime >= STAGE_DUR.ARRIVE_RETURN) {
            state.stage = 'IDLE';
            state.stageTime = 0;
            state.totalTime = 0;
            state.switchedRealmThisJump = false;
            portalMesh.visible = false;
            elRocketCaption.classList.remove('is-hidden');
          }
        }

        // Update 3D Rocket Flame Uniforms & Dynamic Nozzle PointLight
        rocket.outerFlameUniforms.uTime.value = elapsed;
        rocket.outerFlameUniforms.uFlamePower.value = flamePower;
        rocket.outerFlameUniforms.uFlameStretch.value = flameStretch;

        rocket.innerFlameUniforms.uTime.value = elapsed;
        rocket.innerFlameUniforms.uFlamePower.value = flamePower;
        rocket.innerFlameUniforms.uFlameStretch.value = flameStretch * 0.95;

        const flicker = 0.90 + 0.10 * Math.sin(elapsed * 28.0);
        rocket.nozzleLight.intensity = (0.85 + flamePower * 1.95) * flicker;
        rocket.emberMat.color.setRGB(
          1.0,
          Math.min(1.0, 0.72 + flamePower * 0.18),
          Math.min(1.0, 0.42 + flamePower * 0.28)
        );

        // Smooth inertial filtering across optical & warp parameters
        const fastEase = 1.0 - Math.exp(-dt * 10.5);
        const fovEase = 1.0 - Math.exp(-dt * 8.8);
        const bhEase = 1.0 - Math.exp(-dt * 9.5);

        state.warpIntensity += (targetWarp - state.warpIntensity) * fastEase;
        state.chargeIntensity += (targetCharge - state.chargeIntensity) * fastEase;
        state.streakNorm += (targetStretch - state.streakNorm) * (1.0 - Math.exp(-dt * 11.8));
        state.veilEnv += (targetVeil - state.veilEnv) * (1.0 - Math.exp(-dt * 7.2));
        state.fov += (targetFov - state.fov) * fovEase;

        state.bhVisibility += (targetBhVis - state.bhVisibility) * bhEase;
        state.bhWorldRadius += (targetBhWorldRadius - state.bhWorldRadius) * bhEase;
        state.bhLensStrength += (targetBhLens - state.bhLensStrength) * bhEase;
        state.bhChargePulse += (targetBhCharge - state.bhChargePulse) * bhEase;
        state.bhAbsorbPulse *= Math.exp(-dt * 4.2);
        if (state.bhAbsorbPulse < 0.001) state.bhAbsorbPulse = 0;

        // Clean snap to exact 0 at rest for razor-sharp stationary stars
        const isIdle = state.stage === 'IDLE';
        const cleanWarp = state.warpIntensity < 0.0008 && isIdle ? 0.0 : state.warpIntensity;
        const cleanStretch = state.streakNorm < 0.0005 && isIdle ? 0.0 : state.streakNorm;
        const cleanBhVis = state.bhVisibility < 0.001 && isIdle ? 0.0 : state.bhVisibility;
        const cleanBhLens = state.bhLensStrength < 0.001 && isIdle ? 0.0 : state.bhLensStrength;

        updatePhaseHUD(phaseText, showProgress, progressPct);

        // 3) Advance Breakthrough & Arrival Lensing Ripples
        for (let i = 0; i < 2; i++) {
          const r = ripples[i];
          if (r.active) {
            r.progress += dt * r.speed;
            if (r.progress >= 1.0) {
              r.active = false;
              r.progress = 0;
              r.strength = 0;
            }
          }
        }

        // 4) Advance All 3 Dynamic Star Layers Continuously (ZERO Frozen Background Stars!)
        const deepSpeed = 0.72 + Math.max(0, mainSpeed - 2.6) * params.bgStarSpeed;
        state.deepTravel += deepSpeed * dt;
        state.mainTravel += mainSpeed * dt;
        state.flybyTravel += mainSpeed * dt;
        state.veilFlow += (0.35 + cleanWarp * 5.4) * dt;
        state.nebulaDrift += (0.05 + cleanWarp * 0.90) * dt;

        // 5) Camera Dynamic FOV & Smooth Mouse Parallax (Zero Jitter / Zero Shake!)
        camera.fov = state.fov;
        camera.updateProjectionMatrix();

        const targetPtrX = centerParallax ? 0.0 : state.pointerTarget.x;
        const targetPtrY = centerParallax ? 0.0 : state.pointerTarget.y;
        const ptrDamp = 1.0 - Math.exp(-dt * (centerParallax ? 5.2 : 3.2));
        state.pointerSmooth.x += (targetPtrX - state.pointerSmooth.x) * ptrDamp;
        state.pointerSmooth.y += (targetPtrY - state.pointerSmooth.y) * ptrDamp;

        const sereneBank = Math.sin(elapsed * 0.32) * 0.018 * cleanWarp;
        const maxLookRad = THREE.MathUtils.degToRad(4.2);

        camera.position.x = state.pointerSmooth.x * 0.65;
        camera.position.y = state.pointerSmooth.y * 0.48;
        camera.position.z = 0;
        camera.rotation.order = 'YXZ';
        camera.rotation.y = -state.pointerSmooth.x * maxLookRad;
        camera.rotation.x = state.pointerSmooth.y * (maxLookRad * 0.82);
        camera.rotation.z = -state.pointerSmooth.x * 0.020 + sereneBank;
        camera.updateMatrixWorld();

        camera.matrixWorld.extractBasis(camRight, camUp, camForward);
        camForward.negate();

        // Project tunnel vanishing point AND exact 3D Black Hole anchor (0, 0.25, -14.5) through camera!
        const aspect = camera.aspect;
        const tanHalfFov = Math.tan(THREE.MathUtils.degToRad(state.fov * 0.5));

        vanishingNDC.copy(vanishingWorld).project(camera);
        vanishingUvVec.set(
          THREE.MathUtils.clamp(vanishingNDC.x * 0.5 + 0.5, 0.14, 0.86),
          THREE.MathUtils.clamp(vanishingNDC.y * 0.5 + 0.5, 0.14, 0.86)
        );
        backdropUniforms.uVanishingOffset.value.set(
          (vanishingUvVec.x - 0.5) * aspect,
          vanishingUvVec.y - 0.5
        );

        bhNDC.copy(BH_ANCHOR).project(camera);
        blackHoleUvVec.set(bhNDC.x * 0.5 + 0.5, bhNDC.y * 0.5 + 0.5);
        bhViewPos.copy(BH_ANCHOR).applyMatrix4(camera.matrixWorldInverse);
        const bhViewDist = Math.max(-bhViewPos.z, 1.0);
        const bhScreenScale = state.bhWorldRadius / (2.0 * bhViewDist * tanHalfFov);

        // Update 3D Exhaust Particles in rocketScene
        exhaustPool.update(dt, window.innerHeight, state.fov, getDPR());

        // 6) Sync Uniforms Across Backdrop, All 3 Dynamic Star Layers & Post Passes
        backdropUniforms.uTime.value = elapsed;
        backdropUniforms.uDrift.value = state.nebulaDrift;
        backdropUniforms.uFlow.value = state.veilFlow;
        backdropUniforms.uWarp.value = cleanWarp;
        backdropUniforms.uVeilOpacity.value = state.veilEnv * params.spacetimeVeil;
        backdropUniforms.uTanHalfFov.value = tanHalfFov;
        backdropUniforms.uCamRight.value.copy(camRight);
        backdropUniforms.uCamUp.value.copy(camUp);
        backdropUniforms.uCamForward.value.copy(camForward);

        layer1Deep.uniforms.uTime.value = elapsed;
        layer1Deep.uniforms.uTravelDist.value = state.deepTravel;
        layer1Deep.uniforms.uStretchWorld.value = cleanStretch * 38.0 * params.streakLength * (0.65 + params.bgStarSpeed * 1.45);
        layer1Deep.uniforms.uWarpMix.value = cleanWarp;
        layer1Deep.uniforms.uCharge.value = state.chargeIntensity;

        layer2Main.uniforms.uTime.value = elapsed;
        layer2Main.uniforms.uTravelDist.value = state.mainTravel;
        layer2Main.uniforms.uStretchWorld.value = cleanStretch * 96.0 * params.streakLength;
        layer2Main.uniforms.uWarpMix.value = cleanWarp;
        layer2Main.uniforms.uCharge.value = state.chargeIntensity;
        layer2Main.uniforms.uDensityCutoff.value = params.streamDensity;

        layer3Flyby.uniforms.uTime.value = elapsed;
        layer3Flyby.uniforms.uTravelDist.value = state.flybyTravel;
        layer3Flyby.uniforms.uStretchWorld.value = cleanStretch * 132.0 * params.streakLength;
        layer3Flyby.uniforms.uWarpMix.value = cleanWarp;
        layer3Flyby.uniforms.uCharge.value = state.chargeIntensity;

        // Pass 2 Black Hole + Lensing + Ripples uniforms
        lensingBHUniforms.uTime.value = elapsed;
        lensingBHUniforms.uBlackHoleScale.value = bhScreenScale;
        lensingBHUniforms.uBlackHoleVis.value = cleanBhVis;
        lensingBHUniforms.uBlackHoleLens.value = cleanBhLens;
        lensingBHUniforms.uChargePulse.value = state.bhChargePulse;
        lensingBHUniforms.uAbsorbPulse.value = state.bhAbsorbPulse;
        lensingBHUniforms.uRippleScale.value = params.rippleStrength;
        lensingBHUniforms.uRipple1.value.set(ripples[0].progress, ripples[0].strength);
        lensingBHUniforms.uRipple2.value.set(ripples[1].progress, ripples[1].strength);

        // Pass 6 Final Composite uniforms
        const fovNorm = clamp01((state.fov - BASE_FOV) / Math.max(params.maxFov - BASE_FOV, 1));
        compositeUniforms.uWarp.value = cleanWarp;
        compositeUniforms.uFovNorm.value = fovNorm;
        compositeUniforms.uBloomStrength.value = params.bloomGlow;
        compositeUniforms.uChromatic.value = params.chromatic;
        compositeUniforms.uTime.value = elapsed;
        fxaaUniforms.uTime.value = elapsed;

        // ========================================================================
        // 7) EXECUTE 7-PASS HDR + 4x MSAA + SELECTIVE FXAA PIPELINE
        // ========================================================================
        // Pass 1: Render spaceScene (Nebula + Veil + 3 Dynamic SDF Star Layers) -> spaceRT
        renderer.setRenderTarget(spaceRT);
        renderer.clear(true, false, false);
        renderer.render(spaceScene, camera);

        // Pass 2: Full-screen Gravitational Lensing + Black Hole + Warp Ripples -> sceneRT
        renderer.setRenderTarget(sceneRT);
        renderer.clear(true, true, false);
        postQuad.material = lensingBHMat;
        renderer.render(postScene, postCamera);

        // Pass 3: Clear depth buffer & render 3D Q-Rocket + 3D Flames + 3D Sparkles + Portal into sceneRT
        renderer.clearDepth();
        renderer.render(rocketScene, camera);

        // Pass 4: Soft-Threshold HDR Bright Extract -> brightRT
        postQuad.material = brightMat;
        renderer.setRenderTarget(brightRT);
        renderer.render(postScene, postCamera);

        // Pass 5: Dual-Scale Black Pro-Mist Separable Gaussian Bloom
        postQuad.material = blurMat;

        // Tight Star & Rocket Rim Glow (1/2 resolution)
        blurUniforms.uTexelSize.value.set(1 / bloomHalfA.width, 1 / bloomHalfA.height);
        blurUniforms.tDiffuse.value = brightRT.texture;
        blurUniforms.uDirection.value.set(1.10, 0.0);
        renderer.setRenderTarget(bloomHalfB);
        renderer.render(postScene, postCamera);

        blurUniforms.tDiffuse.value = bloomHalfB.texture;
        blurUniforms.uDirection.value.set(0.0, 1.10);
        renderer.setRenderTarget(bloomHalfA);
        renderer.render(postScene, postCamera);

        // Wide Atmospheric Halo (1/4 resolution, 2 smooth iterations)
        blurUniforms.uTexelSize.value.set(1 / bloomQuarterA.width, 1 / bloomQuarterA.height);
        blurUniforms.tDiffuse.value = bloomHalfA.texture;
        blurUniforms.uDirection.value.set(1.60, 0.0);
        renderer.setRenderTarget(bloomQuarterB);
        renderer.render(postScene, postCamera);

        blurUniforms.tDiffuse.value = bloomQuarterB.texture;
        blurUniforms.uDirection.value.set(0.0, 1.60);
        renderer.setRenderTarget(bloomQuarterA);
        renderer.render(postScene, postCamera);

        blurUniforms.tDiffuse.value = bloomQuarterA.texture;
        blurUniforms.uDirection.value.set(2.40, 0.0);
        renderer.setRenderTarget(bloomQuarterB);
        renderer.render(postScene, postCamera);

        blurUniforms.tDiffuse.value = bloomQuarterB.texture;
        blurUniforms.uDirection.value.set(0.0, 2.40);
        renderer.setRenderTarget(bloomQuarterA);
        renderer.render(postScene, postCamera);

        // Pass 6: HDR Bloom + Hue-Preserving ACES Tonemap -> tonemapRT (preserves rocket alpha mask)
        postQuad.material = compositeMat;
        renderer.setRenderTarget(tonemapRT);
        renderer.render(postScene, postCamera);

        // Pass 7: Selective Post-Tonemap FXAA 3.11 (smooths 3D rocket edges, keeps 1px stars crisp) -> Screen
        postQuad.material = fxaaMat;
        renderer.setRenderTarget(null);
        renderer.render(postScene, postCamera);
      }

      // Initialize UI accent & launch 60FPS loop
      applyRealmUI(params.realmIndex, false);
      rafId = requestAnimationFrame(animate);
    }

    if (document.readyState === 'complete') {
      initApp();
    } else {
      window.addEventListener('load', initApp, { once: true });
    }
  </script>
</body>
